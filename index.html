<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume Clouds</title>
<style>
  :root {
    --bg: #181818;
    --panel: #1e1e1e;
    --row: #2a2a2a;
    --row-alt: #262626;
    --border: #3c3c3c;
    --text: #c8c8c8;
    --text-dim: #8a8a8a;
    --accent: #4a8fd6;
    --accent-dim: #2f5f8f;
    --danger: #b04040;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 11px/1.3 -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
    user-select: none;
  }
  #app { display: flex; width: 100%; height: 100%; }

  /* ---- canvas ---- */
  #stage { cursor: crosshair;
    flex: 1 1 auto; min-width: 0; position: relative;
    background: #000; overflow: hidden;
  }
  #stage canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  #stage.pixelated canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  #stage:fullscreen { background: #000; }
  #banner {
    position: absolute; left: 8px; right: 8px; top: 8px; z-index: 2;
    padding: 6px 8px; background: var(--danger); color: #fff;
    border: 1px solid #d06060; border-radius: 2px; white-space: pre-wrap;
    display: none;
  }
  #banner.show { display: block; }

  /* ---- panel ---- */
  #panel {
    flex: 0 0 280px; width: 280px; height: 100%; overflow-y: auto; overflow-x: hidden;
    background: var(--panel); border-left: 1px solid var(--border);
  }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: #444; }
  .group { border-bottom: 1px solid var(--border); }
  .group > header {
    height: 22px; line-height: 22px; padding: 0 6px; background: #333;
    font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .group > header::before { content: "\25BE"; width: 10px; color: var(--text-dim); font-size: 10px; }
  .group.collapsed > header::before { content: "\25B8"; }
  .group > header:hover { background: #3a3a3a; }
  .group.collapsed > .body { display: none; }
  .body { padding: 2px 0; }

  .row {
    display: flex; align-items: center; height: 22px; padding: 0 6px; gap: 6px;
    background: var(--row);
  }
  .row:nth-child(even) { background: var(--row-alt); }
  .row > label { flex: 0 0 76px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row > .val {
    flex: 0 0 44px; height: 16px; line-height: 14px; padding: 0 3px; text-align: right;
    background: #1b1b1b; border: 1px solid var(--border); color: var(--text);
    font: inherit; font-variant-numeric: tabular-nums; outline: none; border-radius: 2px;
  }
  .row > .val:focus { border-color: var(--accent); }
  .row > .val:read-only { color: var(--text-dim); }

  input[type=range] {
    flex: 1 1 auto; min-width: 0; height: 16px; margin: 0; -webkit-appearance: none; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; background: #4b4b4b; border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 9px; height: 13px; margin-top: -5px; border-radius: 2px;
    background: #9a9a9a; border: 1px solid #111;
  }
  input[type=range]:hover::-webkit-slider-thumb { background: #c0c0c0; }
  input[type=range]::-moz-range-track { height: 3px; background: #4b4b4b; }
  input[type=range]::-moz-range-thumb { width: 9px; height: 13px; border-radius: 2px; background: #9a9a9a; border: 1px solid #111; }

  select, .btn, input[type=number] {
    height: 16px; line-height: 14px; padding: 0 5px; font: inherit; color: var(--text);
    background: #3a3a3a; border: 1px solid var(--border); border-radius: 2px; outline: none; cursor: pointer;
  }
  select { flex: 1 1 auto; }
  .btn:hover { background: #474747; }
  .btn:active, .btn.on { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  .btn.grow { flex: 1 1 0; text-align: center; }
  input[type=number] { flex: 1 1 auto; min-width: 0; cursor: text; background: #1b1b1b; }
  input[type=number]:focus { border-color: var(--accent); }
  .seg { display: flex; flex: 1 1 auto; }
  .seg .btn { flex: 1 1 0; border-radius: 0; margin-left: -1px; text-align: center; padding: 0 2px; }
  .seg .btn:first-child { border-radius: 2px 0 0 2px; margin-left: 0; }
  .seg .btn:last-child { border-radius: 0 2px 2px 0; }

  .chk { flex: 1 1 auto; display: flex; align-items: center; }
  .chk input { margin: 0; width: 12px; height: 12px; accent-color: var(--accent); }
  .stat { flex: 1 1 auto; color: var(--text-dim); font-variant-numeric: tabular-nums; text-align: right; }
  .hint { padding: 3px 6px; color: var(--text-dim); font-size: 10px; }
  #loadFile { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="stage" class="pixelated">
    <canvas id="canvas"></canvas>
    <div id="banner"></div>
  </div>

  <div id="panel">
    <section class="group" data-group="playback">
      <header>Playback</header>
      <div class="body">
        <div class="row">
          <button class="btn grow" id="btnPlay">Pause</button>
          <button class="btn grow" id="btnRestart">Restart</button>
        </div>
        <div class="row"><label>FPS</label><span class="stat" id="statFps">--</span></div>
        <div class="row"><label>Blobs</label><span class="stat" id="statBlobs">--</span></div>
      </div>
    </section>

    <section class="group" data-group="field">
      <header>Field</header>
      <div class="body">
        <div class="row">
          <label>Seed</label>
          <input type="number" id="seed" min="0" max="999999999" step="1">
          <button class="btn" id="btnShuffle">Shuffle</button>
        </div>
        <div class="row"><label>Preset</label><div class="seg" id="presets"></div></div>
      </div>
    </section>

    <section class="group" data-group="simulation">
      <header>Simulation</header>
      <div class="body" id="simBody"></div>
    </section>

    <section class="group" data-group="look">
      <header>Look</header>
      <div class="body" id="lookBody"></div>
    </section>

    <section class="group" data-group="file">
      <header>File</header>
      <div class="body">
        <div class="row">
          <button class="btn grow" id="btnSave">Save JSON</button>
          <button class="btn grow" id="btnLoad">Load JSON</button>
          <button class="btn grow" id="btnCopy">Copy</button>
          <input type="file" id="loadFile" accept="application/json,.json">
        </div>
        <div class="hint">Space play/pause &middot; R restart &middot; F fullscreen</div>
      </div>
    </section>
  </div>
</div>

<script src="src/sim.js?v=7"></script>
<script src="src/render.js?v=7"></script>
<script src="src/app.js?v=7"></script>
</body>
</html>
