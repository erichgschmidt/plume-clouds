<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume Clouds — Puffs</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f22; color: #d8e2e6; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #stage { flex: 1; position: relative; background: #10303c; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #panel { user-select: none; -webkit-user-select: none; width: 260px; background: #23282c; border-left: 1px solid #000; overflow-y: auto; padding: 8px; box-sizing: border-box; }
  h3 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9fb0b8; }
  .row { display: flex; align-items: center; gap: 6px; height: 22px; }
  .row label { width: 72px; color: #b8c4ca; white-space: nowrap; overflow: hidden; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .row .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .btn { background: #343b40; color: #d8e2e6; border: 1px solid #000; border-radius: 3px; padding: 3px 8px; font: inherit; cursor: pointer; }
  .btn.on { background: #4a7a94; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  #hud { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 4px; white-space: pre; }
  #scrubBar { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 30px; background: rgba(0,0,0,.45); padding: 0 10px; border-radius: 4px; }
  #scrubBar #scrubT { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  #keys { position: absolute; left: 10px; bottom: 46px; display: flex; gap: 6px; }
  #keys .key { position: relative; cursor: pointer; }
  #keys canvas { display: block; height: 80px; border: 1px solid #000; border-radius: 3px; background: #10303c; }
  #keys span { position: absolute; left: 4px; bottom: 3px; font-size: 10px; background: rgba(0,0,0,.45); padding: 0 3px; border-radius: 2px; }
  p.hint { color: #8d9ca4; margin: 4px 0 8px; }
  details.grp { margin: 6px 0 2px; }
  details.grp > summary { cursor: pointer; list-style: none; margin: 4px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9fb0b8; user-select: none; }
  details.grp > summary::-webkit-details-marker { display: none; }
  details.grp > summary::before { content: '\25B8'; display: inline-block; width: 12px; color: #6f8089; }
  details.grp[open] > summary::before { content: '\25BE'; }
  details.grp > summary .n { color: #6f8089; font-weight: normal; margin-left: 4px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="canvas"></canvas><div id="hud"></div>
    <div id="keys"></div>
    <div id="scrubBar" class="row" title="Replays a fresh run of the current type, seed, forces and look to this time, in fixed steps: the same time always gives the same picture"><button class="btn" id="btnPlay2">Pause</button><button class="btn" id="btnKeys" title="Five key frames across the scrub range, replayed with the current settings; click one to scrub there">Keys</button><label style="width:auto">Scrub</label><input id="scrub" type="range" min="0" max="120" step="0.5" value="0"><span id="scrubT">0s</span></div>
  </div>
  <div id="panel">
    <div id="groupsTop"></div>
    <h3>Cloud type</h3>
    <div class="row"><label>Type</label><select id="type" style="flex:1"></select></div>
    <div class="seg" id="looks" style="margin-top:4px"></div>
    <div class="row" style="margin-top:4px"><input id="lookName" placeholder="preset name" style="flex:1;min-width:0"><button class="btn" id="btnSave">Save</button><button class="btn" id="btnDel">Delete</button></div>
    <div class="row" style="margin-top:6px"><button class="btn" id="btnPlay">Pause</button><button class="btn" id="btnReset">Reset</button><label style="width:auto">Seed</label><input id="seed" type="number" value="1" style="width:56px"></div>
    <h3>Shape</h3>
    <div class="row"><label>Layout</label><select id="shapes" style="flex:1"></select></div>
    <div class="row"><label>Primitive</label><select id="prims" style="flex:1"></select></div>
    <details class="grp" id="forcesGrp" open><summary>Forces<span class="n" id="forcesN"></span></summary><div id="forces"></div></details>
    <div id="groups"></div>
  </div>
</div>

    ['Noise', ['noise', 'noiseScale', 'noiseBias', 'noise2', 'noise2Scale', 'noiseBias2', 'flow', 'streak', 'anchor', 'smooth']],
    ['Rims', ['rim', 'puffRim']],
    ['Light', ['sun', 'elevation', 'shadow', 'fill', 'bands', 'grain']],
    ['Shadows', ['contact', 'cavity', 'cavityReach', 'cavityLit', 'baseShade', 'baseFall', 'stackShade', 'haze']],
    ['Dither', ['dither', 'dissolve', 'evapScale', 'stipple', 'stippleBias', 'breakup', 'breakupReach', 'dotSize', 'patternLock']],
    ['Sky', ['depthFall', 'cirrus', 'cirrusScale', 'cirrusAngle', 'veil']]
  ];
  var GROUP_KEYS = [].concat.apply([], GROUPS.map(function (g) { return g[1]; }));
  buildGroups($('groupsTop'), [VIEW_GROUP], [SURFACE, LIGHT, VIEW], function () { return look; }, null, GROUP_KEYS);   // the view controls at the top of the panel
  buildGroups($('groups'), GROUPS, [SURFACE, LIGHT, VIEW], function () { return look; }, null, VIEW_GROUP[1]);
  // the Forces group (rebuilt per engine) remembers its open state like the others
  (function () { var d = $('forcesGrp'), st = {}; try { st = JSON.parse(localStorage.getItem('plume-puffs-groups') || '{}'); } catch (e) {} if (st.Forces !== undefined) d.open = !!st.Forces;
    d.addEventListener('toggle', function () { try { var o = JSON.parse(localStorage.getItem('plume-puffs-groups') || '{}'); o.Forces = d.open; localStorage.setItem('plume-puffs-groups', JSON.stringify(o)); } catch (e) {} }); })();
  function refresh() { for (var k in sliders) sliders[k](); }
  var playing = true;
  function setPlaying(v) { playing = v; $('btnPlay').textContent = $('btnPlay2').textContent = playing ? 'Pause' : 'Play'; }

  // cloud types (src/presets.js): engine + sim preset + layout + primitive + form
  function applyType(name) {
    var T = CLOUD_PRESETS[name]; if (!T) return;
    typeName = name; engine = T.engine;
    var seed = +$('seed').value | 0;
    sim = makeSim(engine, T.preset, seed, T.shape || 'ring'); window.sim = sim;
    if (engine === 'veil') { sim.params.count = 0; sim.parcels = []; sim._emit(); }
    for (var k in T.forces) sim.params[k] = T.forces[k]; sim.reseat();
    Object.assign(look, LOOK0); for (var j in T.look) look[j] = T.look[j];
    look.prim = T.prim || 'sphere'; look.primAmt = T.primAmt === undefined ? 1 : T.primAmt;
    $('prims').value = look.prim; $('shapes').value = sim.shape || 'ring'; $('shapes').disabled = engine !== 'thermal';
    if (engine === 'single') setPlaying(false);   // a single shape starts still: nothing spawns, sways or flows
    extraSim = null; extraLook = null;
    if (T.extra) {
      extraSim = makeSim(T.extra.engine, T.extra.preset, seed + 1, 'ring');
      extraSim.parcels.forEach(function (q) { q.link = 0; q.age = 0; }); extraSim._emit();   // the anvil grows in once the tower is up
      extraLook = Object.assign({}, look, T.extra.look || {});
    }
    buildForces(); refresh();
  }
  Object.keys(CLOUD_PRESETS).forEach(function (nm) { var o = document.createElement('option'); o.value = nm; o.textContent = CLOUD_PRESETS[nm].label || nm; $('type').appendChild(o); });
  $('type').value = 'congestus'; applyType('congestus');   // startup is the type applied over the defaults, the same state Reset gives
  $('type').addEventListener('change', function () { applyType(this.value); });
  // Page presets: forces + surface + light together (the sim preset row above only sets forces).
  var LOOKS = {
    // a few big still puffs, no noise, full bands, Depth 2: every artifact of the field and the normal is bare
    probe: { seed: 3, forces: { updraft: 0, width: 0.2, height: 0.2, rise: 0, expand: 0, settle: 0, count: 5, size: 0.05, jitter: 0, mixing: 1, pulse: 0, base: 0.2, rollGain: 0, formTime: 0, reservoir: 0, parallax: 0 },
      look: { children: 3, ratio: 0.6, levels: 2, life: 0, embed: 0.8, softness: 1, depth: 2, noise: 0, noise2: 0, flow: 0, smooth: 0, haze: 0, sun: 60, elevation: 40, shadow: 0.64, highlight: 0.68, fill: 0.2, baseShade: 0, stackShade: 0, bands: 5, rim: 0, cap: 0, puffRim: 0, contact: 0, cavity: 0, dither: 0, dissolve: 0, grain: 0, pixel: 1, zoom: 1.4 } },
    // the wind erosion's first preset: broad gusts, strong interior protection, sparse wisps, changes over tens of seconds
    fraying: { seed: 2, type: 'congestus', forces: { rollGain: 2, mixing: 40 },
      look: { wind: 10, windSpeed: 0.35, gustSize: 2.5, topEmphasis: 0.7, erosion: 0.5, wispAmount: 0.4, wispLife: 10, streak: 0.5 } },
    lantern: { seed: 1, forces: { updraft: 0.04, width: 0.13, height: 0.18, rise: 0.0004, expand: 0.0002, settle: 0.61, count: 60, size: 0.03, jitter: 0.5, mixing: 20.5, pulse: 0, base: 0.21, rollGain: 8.4, formTime: 90, reservoir: 0.35, parallax: 0 },
      look: { children: 5, ratio: 0.7, levels: 3, life: 0.11, embed: 0.67, softness: 4, depth: 2, noise: 0.11, noiseScale: 4, noise2: 0, noiseBias: 0, flow: 0.034, smooth: 0, haze: 0, sun: 81, elevation: -40, shadow: 0.64, baseShade: 0.59, stackShade: 1, bands: 5 } }
  };
  // saved presets live in localStorage beside the built-in ones
  var STORE = 'plume-puffs-looks';
  function saved() { try { var all = JSON.parse(localStorage.getItem(STORE) || '{}'); for (var k in all) migrate(all[k]); return all; } catch (e) { return {}; } }
  function applyLook(L) {
    migrate(L);
    $('seed').value = L.seed; $('type').value = L.type && CLOUD_PRESETS[L.type] ? L.type : 'congestus'; applyType($('type').value);
    sim.shape = L.shape || 'ring'; sim.reset(L.seed, sim.preset, L.forces);   // the forces go in before the parcels spawn, so Parcels is the population
    $('shapes').value = sim.shape; sim.reseat();
    for (var j in L.look) look[j] = L.look[j];
    look.prim = L.prim || 'sphere'; $('prims').value = look.prim;
    refresh();
  }
  function drawLooks() {
    var all = Object.assign({}, LOOKS, saved()), host = $('looks'); host.innerHTML = '';
    for (var k in LOOKS) migrate(LOOKS[k]);   // the built-in looks are from before rimV 2 too (probe: rim 0, so no change; lantern: default rim)
    Object.keys(all).forEach(function (name) {
      var b = document.createElement('button'); b.className = 'btn'; b.textContent = name;
      b.addEventListener('click', function () { applyLook(all[name]); $('lookName').value = name; });
      host.appendChild(b);
    });
  }
  drawLooks();
  $('btnSave').addEventListener('click', function () {
    var name = $('lookName').value.trim(); if (!name) return;
    var forces = {}; FORCES.forEach(function (s) { forces[s[0]] = sim.params[s[0]]; });
    var lk = {}; SURFACE.concat(LIGHT, VIEW).forEach(function (s) { lk[s[0]] = look[s[0]]; });
    var all = saved(); all[name] = { rimV: RIM_V, seed: +$('seed').value | 0, type: typeName, engine: engine, simPreset: sim.preset, shape: sim.shape, prim: look.prim, forces: forces, look: lk };
    localStorage.setItem(STORE, JSON.stringify(all)); drawLooks();
  });
  $('btnDel').addEventListener('click', function () {
    var name = $('lookName').value.trim(), all = saved(); if (!all[name]) return;
    delete all[name]; localStorage.setItem(STORE, JSON.stringify(all)); drawLooks();
  });
  function fill(sel, names, cur) { names.forEach(function (nm) { var o = document.createElement('option'); o.value = nm; o.textContent = nm; sel.appendChild(o); }); sel.value = cur; }
  fill($('shapes'), ThermalSim.SHAPES, sim.shape); fill($('prims'), PuffRenderer.PRIMS, look.prim);
  $('shapes').addEventListener('change', function () { sim.setShape(this.value); refresh(); });
  $('prims').addEventListener('change', function () { look.prim = this.value; });
  $('btnPlay').addEventListener('click', function () { setPlaying(!playing); });
  $('btnPlay2').addEventListener('click', function () { setPlaying(!playing); });
  // the scrub (for testing): a fresh sim of the current type, seed, forces and look, replayed from 0 to t in fixed steps with a
  // render per step, so the renderer's slow state (child births, wind drift, erosion, wisps) is played through as well; the
  // same t always gives the same picture. Pauses; Play continues from there
  function replay(t) {
    var T = CLOUD_PRESETS[typeName], seed = +$('seed').value | 0, P = sim.params, shape = sim.shape, k;
    sim = makeSim(engine, T.preset, seed, shape); window.sim = sim;
    if (engine === 'veil') { sim.params.count = 0; sim.parcels = []; sim._emit(); }
    for (k in P) sim.params[k] = P[k]; sim.reseat();
    if (T.extra) { extraSim = makeSim(T.extra.engine, T.extra.preset, seed + 1, 'ring'); extraSim.parcels.forEach(function (q) { q.link = 0; q.age = 0; }); extraSim._emit(); }
    sim.aspect = canvas.height / canvas.width;
    renderer.render(frameList(), 0, look);
    for (var s = 0; s < t - 1e-6; s += 0.1) { stepAll(0.1); renderer.render(frameList(), sim.time, look); }
  }
  // key frames: five replays across the scrub range, each copied off the canvas into a thumbnail; the run then returns to where it was
  function takeKeys() {
    var holder = $('keys'), was = playing, t0 = sim.time, max = +$('scrub').max; holder.innerHTML = ''; setPlaying(false);
    for (var k = 1; k <= 5; k++) (function (t) {
      replay(t);
      var cv = document.createElement('canvas'); cv.height = 80; cv.width = Math.round(80 * canvas.width / canvas.height);
      cv.getContext('2d').drawImage(canvas, 0, 0, cv.width, cv.height);
      var d = document.createElement('div'), sp = document.createElement('span'); d.className = 'key'; sp.textContent = t + 's'; d.appendChild(cv); d.appendChild(sp);
      d.addEventListener('click', function () { setPlaying(false); $('scrub').value = t; $('scrubT').textContent = t.toFixed(1) + 's'; replay(t); });
      holder.appendChild(d);
    })(max * k / 5);
    replay(t0); setPlaying(was);
  }
  $('btnKeys').addEventListener('click', takeKeys);
  var scrubbing = false;
  $('scrub').addEventListener('pointerdown', function () { scrubbing = true; });
  $('scrub').addEventListener('input', function () { scrubbing = true; $('scrubT').textContent = (+this.value).toFixed(1) + 's'; });
  $('scrub').addEventListener('change', function () { setPlaying(false); replay(+this.value); scrubbing = false; });
  // drag in the canvas to move the eye: every parcel shifts by its depth (an unlocked parallax); double-click recentres
  var drag = null;
  canvas.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, ex: sim.eyeX || 0, ey: sim.eyeY || 0 }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', function (e) { if (!drag) return; var k = 0.12 / canvas.clientWidth; sim.eyeX = drag.ex + (e.clientX - drag.x) * k; sim.eyeY = drag.ey + (e.clientY - drag.y) * k; });
  canvas.addEventListener('pointerup', function () { drag = null; });
  canvas.addEventListener('dblclick', function () { sim.eyeX = 0; sim.eyeY = 0; });
  $('btnReset').addEventListener('click', function () { applyType(typeName); });
  $('seed').addEventListener('change', function () { applyType(typeName); });

  window.sim = sim; window.look = look; window.renderer = renderer;
  function stepAll(dt) {
    sim.step(dt);
    if (extraSim) { extraSim.aspect = sim.aspect; extraSim.params.level = (sim.topY + (CLOUD_PRESETS[typeName].extra.dy || 0)) / sim.aspect; extraSim.params.wind = look.wind; if (sim.time >= 0.6 * (sim.params.formTime || 0)) extraSim.step(dt); }
  }
  function frameList() {
    var list = [{ sim: sim, look: look }];
    if (extraSim) { for (var ek in look) if (!(ek in CLOUD_PRESETS[typeName].extra.look)) extraLook[ek] = look[ek]; list.push({ sim: extraSim, look: extraLook }); }
    return list;
  }
  var last = performance.now(), fpsT = 0, frames = 0, fps = 0;
  function loop(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    sim.aspect = canvas.height / canvas.width;
    if (playing) stepAll(dt);
    renderer.render(frameList(), sim.time, look);
    if (!scrubbing) { $('scrub').value = Math.min(120, sim.time); $('scrubT').textContent = sim.time.toFixed(1) + 's'; }
    frames++; fpsT += dt;
    if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    hud.textContent = (window.PLUME_BUILD ? 'build ' + PLUME_BUILD.commit + ' ' + PLUME_BUILD.date + '   ' : '') + 'fps ' + fps + '   ' + typeName + '   parcels ' + sim.blobCount + (extraSim ? '+' + extraSim.blobCount : '') + '   puffs ' + renderer.count + '   t ' + sim.time.toFixed(0) + 's';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
