<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume Clouds — Puffs</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f22; color: #d8e2e6; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #stage { flex: 1; position: relative; background: #10303c; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #panel { user-select: none; -webkit-user-select: none; width: 260px; background: #23282c; border-left: 1px solid #000; overflow-y: auto; padding: 8px; box-sizing: border-box; }
  h3 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9fb0b8; }
  .row { display: flex; align-items: center; gap: 6px; height: 22px; }
  .row label { width: 72px; color: #b8c4ca; white-space: nowrap; overflow: hidden; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .row .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .btn { background: #343b40; color: #d8e2e6; border: 1px solid #000; border-radius: 3px; padding: 3px 8px; font: inherit; cursor: pointer; }
  .btn.on { background: #4a7a94; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  #hud { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 4px; white-space: pre; }
  p.hint { color: #8d9ca4; margin: 4px 0 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="canvas"></canvas><div id="hud"></div></div>
  <div id="panel">
    <h3>Cloud type</h3>
    <div class="row"><label>Type</label><select id="type" style="flex:1"></select></div>
    <div class="seg" id="looks" style="margin-top:4px"></div>
    <div class="row" style="margin-top:4px"><input id="lookName" placeholder="preset name" style="flex:1;min-width:0"><button class="btn" id="btnSave">Save</button><button class="btn" id="btnDel">Delete</button></div>
    <div class="row" style="margin-top:6px"><button class="btn" id="btnPlay">Pause</button><button class="btn" id="btnReset">Reset</button><label style="width:auto">Seed</label><input id="seed" type="number" value="1" style="width:56px"></div>
    <h3>Shape</h3>
    <div class="row"><label>Layout</label><select id="shapes" style="flex:1"></select></div>
    <div class="row"><label>Primitive</label><select id="prims" style="flex:1"></select></div>
    <h3>View</h3>
    <div id="view"></div>
    <h3>Forces</h3>
    <div id="forces"></div>
    <h3>Surface</h3>
    <div id="surface"></div>
    <h3>Light</h3>
    <div id="light"></div>
  </div>
</div>
<script src="src/sim.js?v=158"></script>
<script src="src/puffs.js?v=158"></script>
<script src="src/motion.js?v=158"></script>
<script src="src/layer.js?v=158"></script>
<script src="src/presets.js?v=158"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('canvas'), stageEl = $('stage'), hud = $('hud');
  function fit() { canvas.width = Math.max(320, Math.floor(stageEl.clientWidth / 2)); canvas.height = Math.max(200, Math.floor(stageEl.clientHeight / 2)); }
  fit(); addEventListener('resize', fit);
  var renderer = new PuffRenderer(canvas);
  renderer.resize(240);
  var engine = 'thermal', typeName = 'congestus', extraSim = null, extraLook = null;
  function makeSim(eng, preset, seed, shape) {
    var asp = canvas.height / canvas.width;
    if (eng === 'layer') return new LayerSim({ seed: seed, preset: preset, aspect: asp });
    if (eng === 'veil') return new LayerSim({ seed: seed, preset: 'stratus', aspect: asp, params: {} });   // a dummy, emptied below
    return new ThermalSim({ seed: seed, preset: preset, aspect: asp, shape: shape });
  }
  var sim = makeSim('thermal', 'congestus', 1, 'ring');

  var look = { children: 6, ratio: 0.62, levels: 3, life: 1, embed: 0.9, softness: 1.0, depth: 1, swayScale: 1, roll: 1,
    noise: 0.15, noiseScale: 1.5, noise2: 0.1, noise2Scale: 4, noiseBias: 0, noiseBias2: 0, flow: 0.04, smooth: 0.5, haze: 0.5, shear: 0, shearBias: 0, wind: 0, lean: 0, prim: 'sphere', primAmt: 1, panX: 0, panY: 0, diag: 0, dither: 0, dissolve: 0.7, dotSize: 1, grain: 1, anchor: 1, zoom: 1,
    sun: 60, elevation: 40, shadow: 0.64, highlight: 0.68, fill: 0.2, bands: 5, depthFall: 0, atmos: 0, cirrus: 0, cirrusScale: 2, cirrusAngle: -12, cirrusFlow: 0.01, veil: 0, baseShade: 0.5, stackShade: 0.4, pixelated: true, pixel: 2, rim: 0.5, puffRim: 0, cap: 0, contact: 0, cavity: 0, cavityReach: 8, baseFall: 0.7 };

  var LOOK0 = Object.freeze(Object.assign({}, look));   // the page defaults: every type and saved preset starts from these, never from the previous look
  var FORCES = CLOUD_FORCES.thermal;
  var SURFACE = [['pixel', 'Pixel size', 1, 6, 1], ['rim', 'Rim soften', 0, 1, 0.01], ['cap', 'Cap', 0, 1, 0.01], ['puffRim', 'Puff rim', 0, 1, 0.01], ['children', 'Children', 0, 6, 1], ['ratio', 'Size ratio', 0.25, 0.7, 0.01], ['levels', 'Levels', 1, 3, 1], ['life', 'Life', 0, 3, 0.01], ['embed', 'Embed', 0.4, 1, 0.01], ['softness', 'Softness', 0.3, 4, 0.01], ['depth', 'Depth', 0, 2, 0.01], ['swayScale', 'Sway depth', 0, 2, 0.01],
    ['noise', 'Noise', 0, 1.5, 0.01], ['noiseScale', 'Noise scale', 0.3, 4, 0.01], ['noiseBias', 'Noise bias', -1, 1, 0.01], ['noise2', 'Noise 2', 0, 1.5, 0.01], ['noise2Scale', 'Noise 2 scale', 1, 12, 0.1], ['noiseBias2', 'Noise 2 bias', -1, 1, 0.01], ['flow', 'Flow', 0, 0.3, 0.001], ['anchor', 'Noise anchor', 0, 1, 0.01], ['smooth', 'Normal smooth', 0, 1, 0.01], ['shear', 'Shear', 0, 3, 0.05], ['shearBias', 'Shear bias', -1, 1, 0.01], ['wind', 'Wind (deg)', -90, 90, 1], ['lean', 'Lean', -1, 1, 0.01], ['primAmt', 'Primitive amt', 0, 1, 0.01]];
  var VIEW = [['zoom', 'Scale', 0.5, 2.5, 0.05], ['panX', 'Pan X', -1, 1, 0.01], ['panY', 'Pan Y', -1, 1, 0.01], ['diag', 'Diag view', 0, 5, 1]];
  var LIGHT = [['sun', 'Sun', 0, 360, 1], ['elevation', 'Elevation', -60, 60, 1], ['shadow', 'Shadow', 0, 1, 0.01], ['contact', 'Contact', 0, 1, 0.01], ['cavity', 'Cavity', 0, 1, 0.01], ['cavityReach', 'Cavity reach', 2, 24, 1], ['fill', 'Fill', 0, 1, 0.01], ['baseShade', 'Base shade', 0, 1, 0.01], ['baseFall', 'Base falloff', 0.1, 1.5, 0.01], ['stackShade', 'Stack shade', 0, 1, 0.01], ['haze', 'Haze', 0, 1, 0.01], ['dither', 'Dither', 0, 1, 0.01], ['dissolve', 'Dissolve', 0, 1, 0.01], ['dotSize', 'Dot size', 1, 4, 1], ['grain', 'Palette dither', 0, 2, 0.01], ['depthFall', 'Depth falloff', 0, 1, 0.01], ['cirrus', 'Cirrus', 0, 1, 0.01], ['cirrusScale', 'Cirrus scale', 0.5, 6, 0.1], ['cirrusAngle', 'Cirrus angle', -45, 45, 1], ['veil', 'Veil', 0, 1, 0.01], ['bands', 'Bands', 3, 5, 1]];
  var TIPS = { rim: 'Turns the normal toward the viewer at the silhouette, so the dome edge is not a dark ring.', cap: 'Puff profile: 0 a sphere (its rim goes vertical, a thin dark crescent on the far side), 1 a parabola (a broad soft shadow side).', cavity: 'Less light in a valley between puffs (the surface below its surroundings), where the blended slopes otherwise face the viewer and draw a bright seam.', cavityReach: 'How far (field texels) the cavity shading reaches up the walls of a valley.', grain: 'Faint ordered dither added to the light before the bands (the palette grain); 0 is clean bands.', contact: 'Shadow cast by a puff onto the puff behind it, along the light: a dome\'s dark rim continues into shadow instead of ending in a line.', baseFall: 'How far up the cloud the base shade reaches, as a fraction of its height.', puffRim: 'Turns the normal toward the viewer at each puff\'s own rim inside the cloud, where one dome falls over the puff behind it (a crescent line).', pixel: 'Size of one drawn pixel in canvas pixels; the whole picture sits on that grid.',
    updraft: 'Strength of the thermal: how fast parcels rise up the axis and roll over at the top.',
    width: 'Ring width: how far the circulation spreads sideways.',
    height: 'Ring height: how tall the circulation is above the base line.',
    rise: 'Slow drift of the whole thermal upward over time (capped).',
    expand: 'Slow widening of the ring over time (capped).',
    settle: 'Drag near the base: higher keeps the lowest parcels lingering longer.',
    count: 'Number of live parcels (root puffs).',
    size: 'Base radius of a parcel; everything scales from it.',
    jitter: 'Random wander added to each parcel\'s motion.',
    mixing: 'Seconds a sinking flank parcel stays fresh before it mixes away and retires.',
    pulse: 'Seconds between bubbles: cohorts of new parcels released with a surge up the axis. 0 is a steady trickle.',
    base: 'Condensation level: the flat base line below which parcels evaporate.',
    rollGain: 'How fast billows roll with the local vorticity.',
    formTime: 'Seconds the cloud takes to form from a compact puff. 0 starts fully grown.',
    reservoir: 'Share of parcels kept as a dense, soft reservoir just above the base.',
    parallax: 'Sideways sway of the eye; every parcel shifts by its depth.',
    sway: 'Period of the parallax sway in seconds.',
    children: 'Puffs each parcel grows on its shell, at every level.',
    ratio: 'Child radius as a fraction of its parent.',
    levels: 'Depth of the recursion: 1 is bare parcels, 3 is grandchildren.',
    life: 'Speed of the child cycle (born on top, carried round, swells, subsides, reseeds). 0 freezes it.',
    embed: 'How far out on the parent shell a child sits: lower buries it, higher perches it.',
    softness: 'Blend width of the soft union between puffs.',
    depth: 'Scale of the pseudo-3D depth: how far back puffs sit behind their neighbours (heights only; fade and sway have their own controls).',
    swayScale: 'How much child puffs sway by their depth under parallax (was tied to Depth).',
    noise: 'Amplitude of the main surface noise.',
    noiseScale: 'Frequency of the main noise.',
    noise2: 'Amplitude of the finer second noise.',
    noise2Scale: 'Frequency of the second noise.',
    noiseBias: 'Where noise lives: -1 only in shadow, +1 only in light.',
    noiseBias2: 'Where noise 2 lives: -1 only in shadow, +1 only in light.',
    flow: 'Scroll speed of the noise over the surface.',
    anchor: 'How much the noise rides on each parcel (1) versus staying fixed in screen space (0).',
    smooth: 'Footprint of the normal: higher softens the shading.',
    shear: 'How far dispersing parcels stretch along the wind as they mix away.',
    shearBias: 'Shear by depth: +1 the near face shears most, -1 the back does.',
    depthFall: 'Recessed volumes lose shadow, noise and crispness: near billows stay sharp.',
    wind: 'Wind direction in degrees for Shear and Lean. 0 is to the right.',
    lean: 'Tilt of the whole cloud downwind with height above the base.',
    primAmt: 'Blend from a sphere (0) to the chosen primitive (1).',
    sun: 'Sun azimuth in degrees.',
    elevation: 'Sun elevation in degrees; negative lights from below.',
    shadow: 'Darkness of the shadowed side.',
    fill: 'Bounce light from the sky side, opposite the sun.',
    baseShade: 'Darkening from crown to base across the whole cloud.',
    stackShade: 'Darkening each puff inherits from sitting under its parent.',
    haze: 'Softening of old, mixed parcels: flatter shading and a fainter edge.',
    dither: 'Dispersing puffs dissolve into the pixel grid instead of fading.',
    dissolve: 'How much of a dispersing puff\'s interior the dither eats (0: edges only).', dotSize: 'Size of the dither dots in texels.',
    bands: 'Number of colour bands in the palette.',
    zoom: 'View scale about the base line; the sim is untouched.',
    diag: 'Diagnostic view: 0 off, 1 continuous grey lighting (no bands, shadow or fill), 2 height contours, 3 the normal as colour, 4 coverage mask, 5 accepted normal neighbours.',
    panX: 'View offset sideways.',
    panY: 'View offset up and down.'
  };
  var sliders = {};
  function slider(parent, target, spec) {
    var row = document.createElement('div'); row.className = 'row';
    var label = document.createElement('label'); label.textContent = spec[1]; label.title = TIPS[spec[0]] || '';
    var range = document.createElement('input'); range.type = 'range'; range.min = spec[2]; range.max = spec[3]; range.step = spec[4]; range.title = label.title;
    var val = document.createElement('span'); val.className = 'val';
    row.appendChild(label); row.appendChild(range); row.appendChild(val); parent.appendChild(row);
    function show() { var v = target()[spec[0]]; range.value = v; val.textContent = spec[4] >= 1 ? String(v) : (+v).toFixed(spec[4] < 0.001 ? 4 : spec[4] < 0.01 ? 3 : 2); }
    range.addEventListener('input', function () { var v = +range.value; target()[spec[0]] = v; if (spec[0] === 'width' || spec[0] === 'height' || spec[0] === 'base' || spec[0] === 'level' || spec[0] === 'thick' || spec[0] === 'size') sim.reseat(); show(); });
    sliders[spec[0]] = show; show();
  }
  function buildForces() {
    for (var k in sliders) if (sliders[k].force) delete sliders[k];
    $('forces').innerHTML = '';
    FORCES = CLOUD_FORCES[engine] || [];
    var keys = engine === 'layer' ? LAYER_MODE_KEYS[sim.params.mode] : null;
    FORCES.forEach(function (s) { if (keys && keys.indexOf(s[0]) < 0) return; slider($('forces'), function () { return sim.params; }, s); sliders[s[0]].force = true; });
  }
  buildForces();
  SURFACE.forEach(function (s) { slider($('surface'), function () { return look; }, s); });
  LIGHT.forEach(function (s) { slider($('light'), function () { return look; }, s); });
  VIEW.forEach(function (s) { slider($('view'), function () { return look; }, s); });
  function refresh() { for (var k in sliders) sliders[k](); }

  // cloud types (src/presets.js): engine + sim preset + layout + primitive + form
  function applyType(name) {
    var T = CLOUD_PRESETS[name]; if (!T) return;
    typeName = name; engine = T.engine;
    var seed = +$('seed').value | 0;
    sim = makeSim(engine, T.preset, seed, T.shape || 'ring'); window.sim = sim;
    if (engine === 'veil') { sim.params.count = 0; sim.parcels = []; sim._emit(); }
    for (var k in T.forces) sim.params[k] = T.forces[k]; sim.reseat();
    Object.assign(look, LOOK0); for (var j in T.look) look[j] = T.look[j];
    look.prim = T.prim || 'sphere'; look.primAmt = T.primAmt === undefined ? 1 : T.primAmt;
    $('prims').value = look.prim; $('shapes').value = sim.shape || 'ring'; $('shapes').disabled = engine !== 'thermal';
    extraSim = null; extraLook = null;
    if (T.extra) {
      extraSim = makeSim(T.extra.engine, T.extra.preset, seed + 1, 'ring');
      extraSim.parcels.forEach(function (q) { q.link = 0; q.age = 0; }); extraSim._emit();   // the anvil grows in once the tower is up
      extraLook = Object.assign({}, look, T.extra.look || {});
    }
    buildForces(); refresh();
  }
  Object.keys(CLOUD_PRESETS).forEach(function (nm) { var o = document.createElement('option'); o.value = nm; o.textContent = CLOUD_PRESETS[nm].label || nm; $('type').appendChild(o); });
  $('type').value = 'congestus'; applyType('congestus');   // startup is the type applied over the defaults, the same state Reset gives
  $('type').addEventListener('change', function () { applyType(this.value); });
  // Page presets: forces + surface + light together (the sim preset row above only sets forces).
  var LOOKS = {
    // a few big still puffs, no noise, full bands, Depth 2: every artifact of the field and the normal is bare
    probe: { seed: 3, forces: { updraft: 0, width: 0.2, height: 0.2, rise: 0, expand: 0, settle: 0, count: 5, size: 0.05, jitter: 0, mixing: 1, pulse: 0, base: 0.2, rollGain: 0, formTime: 0, reservoir: 0, parallax: 0 },
      look: { children: 3, ratio: 0.6, levels: 2, life: 0, embed: 0.8, softness: 1, depth: 2, noise: 0, noise2: 0, flow: 0, smooth: 0, haze: 0, sun: 60, elevation: 40, shadow: 0.64, highlight: 0.68, fill: 0.2, baseShade: 0, stackShade: 0, bands: 5, rim: 0, cap: 0, puffRim: 0, contact: 0, cavity: 0, dither: 0, dissolve: 0, grain: 0, pixel: 1, zoom: 1.4 } },
    lantern: { seed: 1, forces: { updraft: 0.04, width: 0.13, height: 0.18, rise: 0.0004, expand: 0.0002, settle: 0.61, count: 60, size: 0.03, jitter: 0.5, mixing: 20.5, pulse: 0, base: 0.21, rollGain: 8.4, formTime: 90, reservoir: 0.35, parallax: 0 },
      look: { children: 5, ratio: 0.7, levels: 3, life: 0.11, embed: 0.67, softness: 4, depth: 2, noise: 0.11, noiseScale: 4, noise2: 0, noiseBias: 0, flow: 0.034, smooth: 0, haze: 0, sun: 81, elevation: -40, shadow: 0.64, baseShade: 0.59, stackShade: 1, bands: 5 } }
  };
  // saved presets live in localStorage beside the built-in ones
  var STORE = 'plume-puffs-looks';
  function saved() { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return {}; } }
  function applyLook(L) {
    $('seed').value = L.seed; $('type').value = L.type && CLOUD_PRESETS[L.type] ? L.type : 'congestus'; applyType($('type').value);
    sim.shape = L.shape || 'ring'; sim.reset(L.seed, sim.preset, L.forces);   // the forces go in before the parcels spawn, so Parcels is the population
    $('shapes').value = sim.shape; sim.reseat();
    for (var j in L.look) look[j] = L.look[j];
    look.prim = L.prim || 'sphere'; $('prims').value = look.prim;
    refresh();
  }
  function drawLooks() {
    var all = Object.assign({}, LOOKS, saved()), host = $('looks'); host.innerHTML = '';
    Object.keys(all).forEach(function (name) {
      var b = document.createElement('button'); b.className = 'btn'; b.textContent = name;
      b.addEventListener('click', function () { applyLook(all[name]); $('lookName').value = name; });
      host.appendChild(b);
    });
  }
  drawLooks();
  $('btnSave').addEventListener('click', function () {
    var name = $('lookName').value.trim(); if (!name) return;
    var forces = {}; FORCES.forEach(function (s) { forces[s[0]] = sim.params[s[0]]; });
    var lk = {}; SURFACE.concat(LIGHT, VIEW).forEach(function (s) { lk[s[0]] = look[s[0]]; });
    var all = saved(); all[name] = { seed: +$('seed').value | 0, type: typeName, engine: engine, simPreset: sim.preset, shape: sim.shape, prim: look.prim, forces: forces, look: lk };
    localStorage.setItem(STORE, JSON.stringify(all)); drawLooks();
  });
  $('btnDel').addEventListener('click', function () {
    var name = $('lookName').value.trim(), all = saved(); if (!all[name]) return;
    delete all[name]; localStorage.setItem(STORE, JSON.stringify(all)); drawLooks();
  });
  function fill(sel, names, cur) { names.forEach(function (nm) { var o = document.createElement('option'); o.value = nm; o.textContent = nm; sel.appendChild(o); }); sel.value = cur; }
  fill($('shapes'), ThermalSim.SHAPES, sim.shape); fill($('prims'), PuffRenderer.PRIMS, look.prim);
  $('shapes').addEventListener('change', function () { sim.setShape(this.value); refresh(); });
  $('prims').addEventListener('change', function () { look.prim = this.value; });
  var playing = true;
  $('btnPlay').addEventListener('click', function () { playing = !playing; this.textContent = playing ? 'Pause' : 'Play'; });
  // drag in the canvas to move the eye: every parcel shifts by its depth (an unlocked parallax); double-click recentres
  var drag = null;
  canvas.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, ex: sim.eyeX || 0, ey: sim.eyeY || 0 }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', function (e) { if (!drag) return; var k = 0.12 / canvas.clientWidth; sim.eyeX = drag.ex + (e.clientX - drag.x) * k; sim.eyeY = drag.ey + (e.clientY - drag.y) * k; });
  canvas.addEventListener('pointerup', function () { drag = null; });
  canvas.addEventListener('dblclick', function () { sim.eyeX = 0; sim.eyeY = 0; });
  $('btnReset').addEventListener('click', function () { applyType(typeName); });
  $('seed').addEventListener('change', function () { applyType(typeName); });

  window.sim = sim; window.look = look; window.renderer = renderer;
  var last = performance.now(), fpsT = 0, frames = 0, fps = 0;
  function loop(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    sim.aspect = canvas.height / canvas.width;
    if (playing) { sim.step(dt); if (extraSim) { extraSim.aspect = sim.aspect; extraSim.params.level = (sim.topY + (CLOUD_PRESETS[typeName].extra.dy || 0)) / sim.aspect; extraSim.params.wind = look.wind; if (sim.time >= 0.6 * (sim.params.formTime || 0)) extraSim.step(dt); } }
    var list = [{ sim: sim, look: look }];
    if (extraSim) { for (var ek in look) if (!(ek in CLOUD_PRESETS[typeName].extra.look)) extraLook[ek] = look[ek]; list.push({ sim: extraSim, look: extraLook }); }
    renderer.render(list, sim.time, look);
    frames++; fpsT += dt;
    if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    hud.textContent = 'fps ' + fps + '   ' + typeName + '   parcels ' + sim.blobCount + (extraSim ? '+' + extraSim.blobCount : '') + '   puffs ' + renderer.count + '   t ' + sim.time.toFixed(0) + 's';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
