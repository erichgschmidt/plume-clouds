<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CloudRenderer test</title>
<style>
  body { margin: 0; background: #1a1a1a; color: #ccc; font: 12px monospace; }
  canvas { display: block; width: 640px; height: 480px; image-rendering: pixelated; margin: 8px; }
  #stats { margin: 0 8px; white-space: pre; }
</style>
</head>
<body>
<div style="display:flex;align-items:flex-start"><canvas id="c" width="640" height="480"></canvas><img src="../reference/reference.png" width="640" style="margin:8px;image-rendering:pixelated"></div>
<div id="stats"></div>
<script>document.write('<script src="../src/render.js?' + Date.now() + '"><\/script>');</script>
<script>
(function () {
  var MAX = 64;
  // v2 aux layout: [branchId, z, parentBlob, link]
  // trunk (branch 0, z .5, 5 parcels), child branch 1 (z .75, in front) rooted at trunk parcel 1,
  // child branch 2 (z .25, behind) rooted at trunk parcel 3; children rotate slowly about their roots.
  var MAXB = 64;
  var sim = { blobCount: 13, blobs: new Float32Array(MAXB * 4), aux: new Float32Array(MAXB * 4) };
  var trunk = [
    [0.30, 0.42, 0.095, 0.11], [0.40, 0.37, 0.085, 0.37], [0.50, 0.42, 0.09, 0.62], [0.60, 0.47, 0.08, 0.83], [0.69, 0.52, 0.065, 0.25]
  ];
  // child branches: root parcel index into trunk, z, base angle, angular speed, parcel radii from root to tip
  var kids = [
    { root: 1, z: 0.75, ang: -1.9, spd: 0.08, radii: [0.075, 0.07, 0.06, 0.05], seed: 0.44 },
    { root: 3, z: 0.25, ang: 0.9, spd: -0.06, radii: [0.07, 0.065, 0.055, 0.045], seed: 0.71 }
  ];
  var MAX = MAXB;
  var look = { billow: .5, softness: .3, erosion: .4, sun: 120, elevation: 17, shadow: .8, bands: 18, sky: true, pixelated: true, relief: .5 };
  var canvas = document.getElementById('c');
  var statsEl = document.getElementById('stats');
  var renderer;
  try {
    renderer = new CloudRenderer(canvas);
    renderer.resize(320);
  } catch (e) {
    statsEl.textContent = 'ERROR: ' + e.message;
    console.error(e);
    return;
  }
  window.renderer = renderer; window.sim = sim; window.look = look;

  function update(t) {
    var i, n = 0;
    for (i = 0; i < trunk.length; i++, n++) {
      var b = trunk[i], ph = b[3] * 6.283;
      sim.blobs[n * 4 + 0] = b[0] + 0.012 * Math.sin(t * 0.15 + ph);
      sim.blobs[n * 4 + 1] = b[1] + 0.010 * Math.cos(t * 0.12 + ph * 1.3);
      sim.blobs[n * 4 + 2] = b[2] * (1 + 0.05 * Math.sin(t * 0.3 + ph));
      sim.blobs[n * 4 + 3] = b[3];
      sim.aux[n * 4 + 0] = 0; sim.aux[n * 4 + 1] = 0.5; sim.aux[n * 4 + 2] = -1; sim.aux[n * 4 + 3] = 0;
    }
    for (var c = 0; c < kids.length; c++) {
      var kd = kids[c], rootBlob = kd.root, rx = sim.blobs[rootBlob * 4], ry = sim.blobs[rootBlob * 4 + 1];
      var ang = kd.ang + kd.spd * t, dist = 0;
      for (i = 0; i < kd.radii.length; i++, n++) {
        var r = kd.radii[i], breathe = (i === kd.radii.length - 1) ? 1 + 0.12 * Math.sin(t * 0.5 + c) : 1;
        dist += (i === 0) ? r * 1.0 : r * 1.3;
        sim.blobs[n * 4 + 0] = rx + Math.cos(ang) * dist;
        sim.blobs[n * 4 + 1] = ry + Math.sin(ang) * dist * 0.8;
        sim.blobs[n * 4 + 2] = r * breathe;
        sim.blobs[n * 4 + 3] = kd.seed + i * 0.13;
        sim.aux[n * 4 + 0] = c + 1;
        sim.aux[n * 4 + 1] = 0.5 + (kd.z - 0.5) * (i + 1) / kd.radii.length;   // z ramps from the trunk's depth at the root to the branch depth at the tip
        sim.aux[n * 4 + 2] = (i === 0) ? rootBlob : -1;
        sim.aux[n * 4 + 3] = (i === 0) ? 1 : 0;
      }
    }
    sim.blobCount = n;
  }

  var start = performance.now();
  var frames = 0, fpsT = start, fps = 0;
  function frame(now) {
    var t = (now - start) / 1000;
    update(t);
    renderer.render(sim, look, t);
    frames++;
    if (now - fpsT > 500) { fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; }
    var s = renderer.stats;
    statsEl.textContent = 'field ' + s.fieldW + 'x' + s.fieldH + '  draw ' + s.lastDrawMs.toFixed(2) + ' ms  fps ' + fps.toFixed(0) +
      '  packed=' + renderer._packed + '  t=' + t.toFixed(1);
    var err = renderer.gl.getError();
    if (err) console.error('GL error', err);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
