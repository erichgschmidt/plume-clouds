<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume Clouds — Single puff</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f22; color: #d8e2e6; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #stage { flex: 1; position: relative; background: #10303c; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #panel { width: 260px; background: #23282c; border-left: 1px solid #000; overflow-y: auto; padding: 8px; box-sizing: border-box; }
  h3 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9fb0b8; }
  .row { display: flex; align-items: center; gap: 6px; height: 22px; }
  .row label { width: 72px; color: #b8c4ca; white-space: nowrap; overflow: hidden; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .row .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .btn { background: #343b40; color: #d8e2e6; border: 1px solid #000; border-radius: 3px; padding: 3px 8px; font: inherit; cursor: pointer; }
  #hud { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 4px; white-space: pre; }
  p.hint { color: #8d9ca4; margin: 4px 0 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="canvas"></canvas><div id="hud"></div></div>
  <div id="panel">
    <h3>Puff</h3>
    <div class="row"><button class="btn" id="btnPlay">Pause</button><button class="btn" id="btnReset">Reset</button><label style="width:auto">Seed</label><input id="seed" type="number" value="1" style="width:56px"></div>
    <div id="puff"></div>
    <p class="hint">One parcel. Roll is the skin turn rate in rad/s; Axis tilt 0 = turning in the screen plane (a flank puff), 1 = rolling toward the viewer (a front puff). Freshness is what the thermal feeds the renderer as a parcel ages.</p>
    <h3>Surface</h3>
    <div id="surface"></div>
    <h3>Light</h3>
    <div id="light"></div>
  </div>
</div>
<script src="src/sim.js?v=83"></script>
<script src="src/render.js?v=83"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('canvas'), stageEl = $('stage'), hud = $('hud');
  function fit() { canvas.width = Math.max(320, Math.floor(stageEl.clientWidth / 2)); canvas.height = Math.max(200, Math.floor(stageEl.clientHeight / 2)); }
  fit(); addEventListener('resize', fit);
  var renderer = new CloudRenderer(canvas);
  renderer.resize(240);
  var MAX = CloudRenderer.MAX_BLOBS;

  // A one-parcel "sim" with the same interface the thermal exposes.
  function PuffSim(seed) {
    this.blobs = new Float32Array(MAX * 4); this.aux = new Float32Array(MAX * 4);
    this.spin = new Float32Array(MAX * 4); this.detail = new Float32Array(MAX);
    this.params = { radius: 0.3, roll: 0.16, tilt: 0, fresh: 1, lift: 0.5, second: 0 };
    this.reset(seed);
  }
  PuffSim.prototype.reset = function (seed) { this.seed = seed; this.time = 0; this.angle = 0; this.aspect = 0.6; this.blobCount = 0; this._emit(); };
  PuffSim.prototype.step = function (dt) { this.time += dt; this.angle += this.params.roll * dt; this._emit(); };
  PuffSim.prototype._emit = function () {
    var B = this.blobs, A = this.aux, S = this.spin, D = this.detail, P = this.params, a = this.aspect;
    for (var k = 0; k < MAX * 4; k++) { B[k] = 0; A[k] = 0; S[k] = 0; }
    for (k = 0; k < MAX; k++) D[k] = 1;
    var r = P.radius, cx = 0.5, cy = a * (1 - P.lift);
    // axis: tilt 0 -> (0,0,1) (screen-plane turn), 1 -> (-1,0,0) (rolls toward the viewer, top away)
    var t = P.tilt, ax = -Math.sin(t * Math.PI / 2), az = Math.cos(t * Math.PI / 2);
    B[0] = cx; B[1] = cy; B[2] = r; B[3] = 7.7 + this.seed * 13.1;
    A[0] = 0; A[1] = 0.5; A[2] = -1; A[3] = 1;
    S[0] = ax; S[1] = 0; S[2] = az; S[3] = this.angle || 1e-6;
    D[0] = P.fresh;
    var n = 1;
    if (P.second > 0) {
      // an optional neighbour below-left, to see the seam and the shadow it throws
      B[4] = cx - r * 0.9; B[5] = cy + r * 0.7; B[6] = r * P.second; B[7] = 3.3 + this.seed * 7.7;
      A[4] = 0; A[5] = 0.45; A[6] = 0; A[7] = 1;
      S[4] = 0; S[5] = 0; S[6] = 1; S[7] = this.angle * 0.7 || 1e-6;
      D[1] = P.fresh; n = 2;
    }
    this.baseY = cy + r * 1.3; this.topY = cy - r * 1.3;
    this.blobCount = n;
  };

  var sim = new PuffSim(1);
  var look = { billow: 2, softness: 1.4, blend: 1, erosion: .35, erosionFlow: .01, relief: 1.4, depth: .55, roll: 1, rollSync: 0, capLife: 1, capWarp: 0, stackShade: 0.4,
    sun: 60, elevation: 40, shadow: .64, highlight: .68, fill: .2, bands: 5, flatten: .85, shadowDetail: .1, formAO: 1.1, formRadius: 3, baseShade: .6,
    ink: .5, sky: true, pixelated: true, toon: false, patchN: true, carveEnabled: true, noiseType: 'Voronoi', invertNoise: true,
    ao: 0.15, aoRadius: 1.2, aoFalloff: 1.5, primaryNoiseType: 'Voronoi', primaryInvertNoise: true, primaryScale: 1.8, inflation: 0.1,
    embed: 0.12, lobes: 4, lobeSize: 0.62, detailBand: 0.35, baseFlatten: 0.8, primaryCarve: 1.2, carve: 0.25, cellScale: 1.2, cellFlow: 0.5 };

  var PUFF = [['radius', 'Radius', 0.05, 0.4, 0.005], ['roll', 'Roll (rad/s)', 0, 2, 0.01], ['tilt', 'Axis tilt', 0, 1, 0.01], ['fresh', 'Freshness', 0, 1, 0.01], ['lift', 'Lift', 0.2, 0.8, 0.01], ['second', 'Neighbour', 0, 1.2, 0.05]];
  var SURFACE = [['roll', 'Roll scale', 0, 2, 0.01], ['capLife', 'Cap life', 0, 3, 0.01], ['cellFlow', 'Flow', 0, 3, 0.01], ['erosionFlow', 'Erosion flow', 0, 0.2, 0.001], ['billow', 'Billow', 0, 10, 0.01], ['capWarp', 'Cap warp', 0, 1, 0.01], ['lobes', 'Big lobes', 0, 5, 1],
    ['lobeSize', 'Lobe size', 0.3, 0.8, 0.01], ['detailBand', 'Detail band', 0, 1, 0.01], ['baseFlatten', 'Base flatten', 0, 1, 0.01], ['relief', 'Relief', 0, 3, 0.01], ['depth', 'Depth', 0, 2, 0.01], ['erosion', 'Erosion', 0, 3, 0.01], ['primaryCarve', 'Carve', 0, 3, 0.01], ['primaryScale', 'Carve scale', 0.3, 4, 0.01]];
  var LIGHT = [['sun', 'Sun', 0, 360, 1], ['elevation', 'Elevation', -60, 60, 1], ['shadow', 'Shadow', 0, 1, 0.01], ['softness', 'Softness', 0.3, 4, 0.01], ['baseShade', 'Base shade', 0, 1, 0.01], ['stackShade', 'Stack shade', 0, 1, 0.01], ['formAO', 'Form AO', 0, 2, 0.01], ['ao', 'Nook AO', 0, 3, 0.01], ['shadowDetail', 'Shadow detail', 0, 1, 0.01], ['flatten', 'Normal smooth', 0, 1, 0.01]];
  var sliders = {};
  function slider(parent, target, spec) {
    var row = document.createElement('div'); row.className = 'row';
    var label = document.createElement('label'); label.textContent = spec[1];
    var range = document.createElement('input'); range.type = 'range'; range.min = spec[2]; range.max = spec[3]; range.step = spec[4];
    var val = document.createElement('span'); val.className = 'val';
    row.appendChild(label); row.appendChild(range); row.appendChild(val); parent.appendChild(row);
    function show() { var v = target()[spec[0]]; range.value = v; val.textContent = spec[4] >= 1 ? String(v) : (+v).toFixed(spec[4] < 0.001 ? 4 : spec[4] < 0.01 ? 3 : 2); }
    range.addEventListener('input', function () { target()[spec[0]] = +range.value; show(); });
    sliders[spec[0]] = show; show();
  }
  PUFF.forEach(function (s) { slider($('puff'), function () { return sim.params; }, s); });
  SURFACE.forEach(function (s) { slider($('surface'), function () { return look; }, s); });
  LIGHT.forEach(function (s) { slider($('light'), function () { return look; }, s); });

  var playing = true;
  $('btnPlay').addEventListener('click', function () { playing = !playing; this.textContent = playing ? 'Pause' : 'Play'; });
  $('btnReset').addEventListener('click', function () { sim.reset(+$('seed').value | 0); });
  $('seed').addEventListener('change', function () { sim.reset(+this.value | 0); });

  window.sim = sim; window.look = look; window.renderer = renderer;
  var last = performance.now(), fpsT = 0, frames = 0, fps = 0;
  function loop(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    sim.aspect = canvas.height / canvas.width;
    if (playing) sim.step(dt); else sim._emit();
    renderer.render(sim, look, sim.time);
    frames++; fpsT += dt;
    if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    hud.textContent = 'fps ' + fps + '   t ' + sim.time.toFixed(0) + 's   angle ' + (sim.angle % (2 * Math.PI)).toFixed(2);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
