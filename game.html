<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume Clouds — Stage</title>
<style>
  html, body { margin: 0; height: 100%; background: #10303c; color: #d8e2e6; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #hud { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 4px; white-space: pre; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas"></canvas></div>
<div id="hud"></div>
<script src="src/sim.js?v=49"></script>
<script src="src/render.js?v=49"></script>
<script src="src/instances.js?v=49"></script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('canvas'), hud = document.getElementById('hud');
  // internal canvas: 2 screen px per canvas px keeps the pixel-art scale on big displays
  function fit() { canvas.width = Math.max(320, Math.floor(innerWidth / 2)); canvas.height = Math.max(200, Math.floor(innerHeight / 2)); }
  fit(); addEventListener('resize', fit);

  // Stacked cumulus: each puff is its own rolling sprite; puffs shade one another and the ground.
  // No budding or dying lobes (breakup 0): the clouds only drift and roll.
  var stage = new CloudStage(canvas, {
    spriteWidth: 128, spriteHeight: 128, maxInstances: 16,
    parallax: 0.6, haze: 0.12, shadow: 0.85, shadowBase: 0.04, shadowSpread: 0.06, sun: 60, elevation: 40,
    ground: { y: 0.80, color: [0.33, 0.50, 0.38], shadow: 0.55, squash: 3.2, lean: 0.35 }
  });
  // x, y are relative to the camera: 0, 0 is the screen centre
  stage.addGroup({ name: 'near', seed: 11, x: 0.02, y: 0.06, size: 0.40, depth: 0.0, rows: [4, 3, 2, 1], drift: [0.006, 0] });
  stage.addGroup({ name: 'mid',  seed: 23, x: 0.58, y: -0.05, size: 0.30, depth: 0.8, rows: [2, 1], drift: [0.004, 0] });
  stage.addGroup({ name: 'far',  seed: 37, x: -0.62, y: -0.12, size: 0.25, depth: 1.7, rows: [3, 2], drift: [0.003, 0], refreshEvery: 2 });

  window.stage = stage;   // for console experiments
  var camera = { x: 0, y: 0 }, last = performance.now(), fpsT = 0, frames = 0, fps = 0;
  function loop(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    stage.update(dt);
    camera.x += 0.004 * dt;   // slow pan: parallax shows the depth layers
    stage.draw(camera);
    frames++; fpsT += dt;
    if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    hud.textContent = 'fps ' + fps + '   puffs ' + stage.instances.length + '   sprites/frame ' + stage.stats.rendered +
      '\nsprite ' + stage.spriteW + 'x' + stage.spriteH + '   canvas ' + canvas.width + 'x' + canvas.height;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
