<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume Clouds — Stage</title>
<style>
  html, body { margin: 0; height: 100%; background: #10303c; color: #d8e2e6; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #hud { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 4px; white-space: pre; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas"></canvas></div>
<div id="hud"></div>
<script src="src/sim.js?v=49"></script>
<script src="src/render.js?v=49"></script>
<script src="src/instances.js?v=49"></script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('canvas'), hud = document.getElementById('hud');
  // internal canvas: 2 screen px per canvas px keeps the pixel-art scale on big displays
  function fit() { canvas.width = Math.max(320, Math.floor(innerWidth / 2)); canvas.height = Math.max(200, Math.floor(innerHeight / 2)); }
  fit(); addEventListener('resize', fit);

  var stage = new CloudStage(canvas, { spriteWidth: 160, spriteHeight: 112, maxInstances: 8, parallax: 0.9, shadow: 0.7, haze: 0.4 });
  var presets = ['plumes', 'lavalamp', 'plumes', 'confluence', 'lavalamp', 'plumes'];
  var layout = [
    // x, y, size, depth, drift, refreshEvery
    [0.15, 0.35, 0.95, 1.6, 0.004, 3],
    [0.95, 0.25, 1.00, 1.4, 0.005, 3],
    [0.55, 0.50, 0.80, 0.8, 0.009, 2],
    [-0.20, 0.55, 0.85, 0.6, 0.011, 2],
    [0.35, 0.80, 0.70, 0.15, 0.020, 1],
    [1.05, 0.70, 0.75, 0.0, 0.024, 1]
  ];
  for (var i = 0; i < layout.length; i++) {
    var L = layout[i];
    stage.add({ seed: 100 + i * 37, preset: presets[i], x: L[0], y: L[1], size: L[2], depth: L[3],
      drift: [L[4], 0], refreshEvery: L[5] });
  }

  window.stage = stage;   // for console experiments
  var camera = { x: 0, y: 0 }, last = performance.now(), fpsT = 0, frames = 0, fps = 0;
  function loop(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    stage.update(dt);
    camera.x += 0.006 * dt;   // slow pan: parallax shows the depth layers
    // wrap drifting clouds around the far right edge
    for (var k = 0; k < stage.instances.length; k++) {
      var c = stage.instances[k], s = 1 / (1 + c.depth * stage.parallax);
      if ((c.x - camera.x) * s > 0.6 + c.size * s) c.x -= (1.2 + 2 * c.size) / s;
    }
    stage.draw(camera);
    frames++; fpsT += dt;
    if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    hud.textContent = 'fps ' + fps + '   clouds ' + stage.instances.length + '   sprites/frame ' + stage.stats.rendered +
      '\nsprite ' + stage.spriteW + 'x' + stage.spriteH + '   canvas ' + canvas.width + 'x' + canvas.height;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
