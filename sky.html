<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Foundry — Sky</title>
<style>
:root{color-scheme:dark;font:13px/1.45 system-ui,sans-serif;background:#17272e;color:#e4ebe8}*{box-sizing:border-box}body{margin:0}main{display:grid;grid-template-columns:minmax(0,1fr) 292px;height:100vh}#stage{position:relative;min-width:0;overflow:hidden;background:#1a6480}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}aside{overflow:auto;padding:18px;background:#202d32;border-left:1px solid #42545b}h1{font-size:20px;margin:0 0 5px}p{color:#acbfca;font-size:12px;margin:6px 0 14px}a{color:#b4dfe5}nav{display:flex;gap:14px;margin:12px 0}button,select,input{font:inherit}button,select{background:#34474f;color:#edf2ec;border:1px solid #5b717b;border-radius:5px;padding:5px 9px}button{cursor:pointer}button:hover{background:#415b64}input[type=range]{width:100%;min-width:0;margin:0;accent-color:#acd7d4}input[type=number]{width:67px;padding:4px;background:#18272c;color:inherit;border:1px solid #5b717b;border-radius:4px}.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}.row{display:grid;grid-template-columns:98px minmax(0,1fr) 35px;gap:7px;align-items:center;margin:10px 0}.row output{text-align:right;color:#b5d5db;font-variant-numeric:tabular-nums;font-size:11px}.row select{grid-column:2/4;width:100%}details{border-top:1px solid #42545b;margin-top:16px;padding-top:12px}summary{cursor:pointer;font-weight:600;letter-spacing:.03em}#status{min-height:38px;overflow-wrap:anywhere}#status.error{color:#ffd1ac}#hud,#hint{position:absolute;left:14px;padding:7px 10px;border-radius:5px;background:#123641bd;color:#d7e7e7;pointer-events:none;font-size:12px}#hud{top:12px}#hint{bottom:15px}@media(max-width:650px){main{grid-template-columns:minmax(0,1fr) 240px}aside{padding:12px}.row{grid-template-columns:83px minmax(0,1fr) 30px;gap:4px}}
</style>
</head>
<body><main>
<section id="stage" aria-label="Authored cloud sky"><canvas id="canvas"></canvas><div id="hud">Loading cloud…</div><div id="hint">Drag to move viewpoint · A / D move sideways · W / S change elevation</div></section>
<aside><h1>Cloud sky</h1><p>Your authored cloud, carried through a changing sky.</p>
<nav><a href="puffs.html">Open Foundry</a><a href="sky-legacy.html">Legacy sky</a></nav>
<div class="actions"><button id="btnPlay">Pause</button><button id="btnNew">Regenerate</button><label for="seed">Seed</label><input id="seed" type="number" value="1" step="1"></div>
<div class="actions"><button id="btnLoad">Load from Foundry</button><button id="btnStarter">Starter cloud</button><button id="btnImport">Import asset</button><input id="assetFile" type="file" accept=".json,application/json" hidden></div>
<p id="status" role="status" aria-live="polite">Loading your saved cloud…</p><div id="controls"></div>
<p>Pause freezes cloud animation and travel. Camera inspection stays available.</p></aside>
</main>
<script src="src/foundry-assets.js"></script><script src="src/foundry-pixel-grid.js"></script><script src="src/foundry-shaders.js"></script><script src="src/foundry-renderer.js"></script><script src="src/clock.js"></script><script src="assets/foundry-default.js"></script><script src="src/foundry-scene.js"></script><script src="src/foundry-sky-ui.js"></script>
</body></html>
