<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume Clouds — Sky</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f22; color: #d8e2e6; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #stage { flex: 1; position: relative; background: #10303c; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #panel { user-select: none; -webkit-user-select: none; width: 260px; background: #23282c; border-left: 1px solid #000; overflow-y: auto; padding: 8px; box-sizing: border-box; }
  h3 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9fb0b8; }
  .row { display: flex; align-items: center; gap: 6px; height: 22px; }
  .row label { width: 72px; color: #b8c4ca; white-space: nowrap; overflow: hidden; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .row .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .btn { background: #343b40; color: #d8e2e6; border: 1px solid #000; border-radius: 3px; padding: 3px 8px; font: inherit; cursor: pointer; }
  .btn.on { background: #4a7a94; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  #hud { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 4px; white-space: pre; }
  p.hint { color: #8d9ca4; margin: 4px 0 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="canvas"></canvas><div id="hud"></div></div>
  <div id="panel">
    <h3>Sky</h3>
    <div class="row"><button class="btn" id="btnNew">Regenerate</button><button class="btn" id="btnPlay">Pause</button><label style="width:auto">Seed</label><input id="seed" type="number" value="1" style="width:56px"></div>
    <div id="skyp"></div>
    <p class="hint">Every cloud is its own thermal sim drawn into one field. Depth sets its scale, parallax, drift, detail and haze; the species (cumulus, humilis, stratocumulus, tower, altocumulus, and any preset saved in the Puffs sandbox) sets its form.</p>
    <h3>Style</h3>
    <div id="style"></div>
    <h3>Light</h3>
    <div id="light"></div>
    <h3>Cirrus</h3>
    <div id="cirrus"></div>
  </div>
</div>
<script src="src/sim.js?v=101"></script>
<script src="src/puffs.js?v=101"></script>
<script src="src/motion.js?v=101"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('canvas'), stageEl = $('stage'), hud = $('hud');
  function fit() { canvas.width = Math.max(320, Math.floor(stageEl.clientWidth / 2)); canvas.height = Math.max(200, Math.floor(stageEl.clientHeight / 2)); }
  fit(); addEventListener('resize', fit);
  var renderer = new PuffRenderer(canvas);
  renderer.resize(400);

  // the style of the whole sky (the shade pass): one look for every cloud
  var sky = { softness: 1.0, noise: 0.15, noiseScale: 1.5, noise2: 0.1, noise2Scale: 4, noiseBias: 0, flow: 0.04, anchor: 1, smooth: 0.5, haze: 0.4, dither: 0.3,
    atmos: 0.35, depthFall: 0.6, sun: 60, elevation: 40, shadow: 0.64, highlight: 0.68, fill: 0.2, bands: 5, baseShade: 0.5, stackShade: 0.4,
    cirrus: 0.35, cirrusScale: 2, cirrusAngle: -12, cirrusFlow: 0.01, pixelated: true };
  // the sky's own parameters
  var P = { clouds: 9, drift: 0.01, parallax: 0.03, sway: 57, near: 0.6 };

  // species: the form of a cloud (sim preset + overrides, layout, primitive, tree); scale is the
  // size at the nearest depth; weight(far) says how likely it is at a given depth (0 far .. 1 near)
  var SPECIES = {
    cumulus:       { preset: 'congestus', shape: 'ring', prim: 'sphere', scale: 1.0, children: 4, ratio: 0.62, embed: 0.9, life: 1, weight: function (f) { return 0.4 + 0.6 * f; } },
    humilis:       { preset: 'humilis', shape: 'ring', prim: 'sphere', scale: 0.8, children: 4, ratio: 0.6, embed: 0.85, life: 1, weight: function (f) { return 0.8; } },
    stratocumulus: { preset: 'humilis', shape: 'flat', prim: 'disc', primAmt: 0.6, scale: 1.2, children: 3, ratio: 0.66, embed: 0.8, life: 0.6, forces: { width: 0.34, height: 0.1, count: 50 }, weight: function (f) { return 1.0 - 0.6 * f; } },
    tower:         { preset: 'tower', shape: 'tower', prim: 'sphere', scale: 1.1, children: 4, ratio: 0.6, embed: 0.9, life: 1, weight: function (f) { return 0.2 + 0.5 * f; } },
    altocumulus:   { preset: 'humilis', shape: 'flat', prim: 'disc', primAmt: 0.8, scale: 0.45, children: 3, ratio: 0.6, embed: 0.8, life: 0.4, forces: { width: 0.3, height: 0.08, count: 40, size: 0.05 }, weight: function (f) { return 1.2 - 1.1 * f; } }
  };
  // presets saved in the Puffs sandbox join the palette (their forces, layout and primitive)
  try {
    var saved = JSON.parse(localStorage.getItem('plume-puffs-looks') || '{}');
    Object.keys(saved).forEach(function (name) {
      var L = saved[name], lk = L.look || {};
      SPECIES[name] = { shearBias: lk.shearBias, preset: 'congestus', shape: L.shape || 'ring', prim: L.prim || 'sphere', primAmt: lk.primAmt, scale: lk.zoom || 1, children: lk.children, ratio: lk.ratio, embed: lk.embed, life: lk.life, levels: lk.levels, shear: lk.shear, wind: lk.wind, lean: lk.lean, depth: lk.depth, forces: L.forces, weight: function () { return 0.6; } };
    });
  } catch (e) {}

  function mulberry(seed) { var a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  var clouds = [];
  function pick(rng, far) {
    var names = Object.keys(SPECIES), total = 0, w = [];
    names.forEach(function (nm) { var v = Math.max(0, SPECIES[nm].weight(far)); w.push(v); total += v; });
    var r = rng() * total;
    for (var i = 0; i < names.length; i++) { r -= w[i]; if (r <= 0) return names[i]; }
    return names[names.length - 1];
  }
  function makeCloud(rng, i, n, farIn) {
    var far = farIn !== undefined ? farIn : Math.pow(rng(), 0.8);   // 0 far .. 1 near
    var name = pick(rng, far), sp = SPECIES[name];
    var sim = new ThermalSim({ seed: Math.floor(rng() * 1e6), preset: sp.preset, aspect: canvas.height / canvas.width, shape: sp.shape });
    if (sp.forces) for (var k in sp.forces) sim.params[k] = sp.forces[k];
    sim.params.parallax = P.parallax * (0.15 + 0.85 * far); sim.params.sway = P.sway;
    sim.reseat();
    var zoom = sp.scale * (0.3 + 0.7 * Math.pow(far, 1.2)) * P.near;
    var look = { children: sp.children || 4, ratio: sp.ratio || 0.62, levels: sp.levels || (far < 0.35 ? 2 : 3), life: sp.life || 1, embed: sp.embed || 0.9, depth: sp.depth || 1,
      shear: sp.shear || 0, shearBias: sp.shearBias || 0, wind: sp.wind || 0, lean: sp.lean || 0, prim: sp.prim, primAmt: sp.primAmt === undefined ? 1 : sp.primAmt,
      zoom: zoom, panX: -0.8 + 1.6 * ((i + rng() * 0.7) / n) + (rng() - 0.5) * 0.1, panY: (-0.22 + 0.3 * far) + (rng() - 0.5) * 0.12, far: far };
    return { sim: sim, look: look, name: name, speed: P.drift * (0.15 + 0.85 * far) };
  }
  function build() {
    var rng = mulberry((+$('seed').value | 0) * 7919 + 17);
    clouds = [];
    var n = Math.max(1, Math.round(P.clouds));
    // stratified depths (every sky gets its full range) in a shuffled order across the width
    var fars = []; for (var i = 0; i < n; i++) fars.push(Math.pow((i + 0.1 + rng() * 0.8) / n, 0.9));
    for (i = n - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)), tmp = fars[i]; fars[i] = fars[j]; fars[j] = tmp; }
    for (i = 0; i < n; i++) clouds.push(makeCloud(rng, i, n, fars[i]));
    clouds.sort(function (a, b) { return a.look.far - b.look.far; });
    window.clouds = clouds;
  }

  var SKYP = [['clouds', 'Clouds', 1, 14, 1], ['near', 'Near size', 0.3, 1.4, 0.01], ['drift', 'Drift', 0, 0.05, 0.001], ['parallax', 'Parallax', 0, 0.08, 0.002], ['sway', 'Sway (s)', 5, 120, 1]];
  var STYLE = [['softness', 'Softness', 0.3, 4, 0.01], ['noise', 'Noise', 0, 1.5, 0.01], ['noiseScale', 'Noise scale', 0.3, 4, 0.01], ['noise2', 'Noise 2', 0, 1.5, 0.01], ['noise2Scale', 'Noise 2 scale', 1, 12, 0.1], ['noiseBias', 'Noise bias', -1, 1, 0.01], ['flow', 'Flow', 0, 0.3, 0.001], ['anchor', 'Noise anchor', 0, 1, 0.01], ['smooth', 'Normal smooth', 0, 1, 0.01], ['haze', 'Haze', 0, 1, 0.01], ['dither', 'Dither', 0, 1, 0.01], ['atmos', 'Atmosphere', 0, 1, 0.01], ['depthFall', 'Depth falloff', 0, 1, 0.01]];
  var LIGHT = [['sun', 'Sun', 0, 360, 1], ['elevation', 'Elevation', -60, 60, 1], ['shadow', 'Shadow', 0, 1, 0.01], ['fill', 'Fill', 0, 1, 0.01], ['baseShade', 'Base shade', 0, 1, 0.01], ['stackShade', 'Stack shade', 0, 1, 0.01], ['bands', 'Bands', 3, 5, 1]];
  var CIRRUS = [['cirrus', 'Cirrus', 0, 1, 0.01], ['cirrusScale', 'Scale', 0.5, 6, 0.1], ['cirrusAngle', 'Angle (deg)', -45, 45, 1], ['cirrusFlow', 'Flow', 0, 0.1, 0.001]];
  var TIPS = { clouds: 'How many clouds the sky holds (regenerates).', near: 'Scale of the nearest cloud; every depth scales from it (regenerates).', drift: 'Sideways drift speed; near clouds drift faster. A cloud that leaves the frame re-forms on the other side.',
    parallax: 'Sway of the eye; near clouds sway more.', sway: 'Period of the sway in seconds.', atmos: 'How much far clouds take on the sky colour.', depthFall: 'How much far clouds lose shadow, noise and crispness.',
    cirrus: 'Amount of high streak cloud behind everything.', cirrusScale: 'Size of the cirrus streaks.', cirrusAngle: 'Direction of the streaks.', cirrusFlow: 'Scroll speed of the streaks.' };
  var sliders = {};
  function slider(parent, target, spec, onChange) {
    var row = document.createElement('div'); row.className = 'row';
    var label = document.createElement('label'); label.textContent = spec[1]; label.title = TIPS[spec[0]] || '';
    var range = document.createElement('input'); range.type = 'range'; range.min = spec[2]; range.max = spec[3]; range.step = spec[4]; range.title = label.title;
    var val = document.createElement('span'); val.className = 'val';
    row.appendChild(label); row.appendChild(range); row.appendChild(val); parent.appendChild(row);
    function show() { var v = target()[spec[0]]; range.value = v; val.textContent = spec[4] >= 1 ? String(v) : (+v).toFixed(spec[4] < 0.001 ? 4 : spec[4] < 0.01 ? 3 : 2); }
    range.addEventListener('input', function () { target()[spec[0]] = +range.value; show(); if (onChange) onChange(spec[0]); });
    sliders[spec[0]] = show; show();
  }
  SKYP.forEach(function (s) { slider($('skyp'), function () { return P; }, s, function (k) {
    if (k === 'clouds' || k === 'near') build();
    else clouds.forEach(function (c) { c.sim.params.parallax = P.parallax * (0.15 + 0.85 * c.look.far); c.sim.params.sway = P.sway; c.speed = P.drift * (0.15 + 0.85 * c.look.far); });
  }); });
  STYLE.forEach(function (s) { slider($('style'), function () { return sky; }, s); });
  LIGHT.forEach(function (s) { slider($('light'), function () { return sky; }, s); });
  CIRRUS.forEach(function (s) { slider($('cirrus'), function () { return sky; }, s); });

  var playing = true;
  $('btnPlay').addEventListener('click', function () { playing = !playing; this.textContent = playing ? 'Pause' : 'Play'; });
  $('btnNew').addEventListener('click', function () { $('seed').value = (+$('seed').value | 0) + 1; build(); });
  $('seed').addEventListener('change', build);
  build();
  window.sky = sky; window.P = P; window.renderer = renderer; window.SPECIES = SPECIES;

  var last = performance.now(), fpsT = 0, frames = 0, fps = 0, t = 0;
  function loop(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) {
      t += dt;
      for (var i = 0; i < clouds.length; i++) {
        var c = clouds[i];
        c.sim.aspect = canvas.height / canvas.width;
        c.sim.step(dt);
        c.look.panX += c.speed * dt;
        if (c.look.panX > 0.85) { c.look.panX = -0.85; c.sim.reset(Math.floor(Math.random() * 1e6), c.sim.preset); }
      }
    }
    renderer.render(clouds, t, sky);
    frames++; fpsT += dt;
    if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    hud.textContent = 'fps ' + fps + '   clouds ' + clouds.length + '   puffs ' + renderer.count + (renderer.degrade < 1 ? '  (deepest level at ' + Math.round(renderer.degrade * 100) + '%)' : '') + '   t ' + t.toFixed(0) + 's';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
