<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">How a stratocumulus cloud gets its shape</title>
  <desc id="desc">Four schematic panels show shallow closed-cell convection beneath an inversion, the scalloped cloud layer in section, drifting cells and wind-aligned cloud streets in plan, and a painted carpet receding to the horizon. Orange arrows show air motion: rising at cell centres and sinking at their edges.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ce6847" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="lightArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b58d42" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #374750; }
      .heading { font-size: 21px; font-weight: 650; }
      .label { font-size: 16px; }
      .small { font-size: 14px; }
      .note { font-size: 17px; }
      .outline { stroke: #748c99; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .motion { fill: none; stroke: #ce6847; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .leader { fill: none; stroke: #657c89; stroke-width: 1.4; stroke-linecap: round; }
      .cloud { fill: #fffbee; stroke: #748c99; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <!-- A shallow scalloped cell, reused for the plan view. -->
    <g id="cell">
      <path d="M-36 9 C-47-2-39-18-26-18 C-27-32-8-36 1-27 C13-39 31-29 30-17 C47-14 47 4 37 11 C43 25 26 34 14 27 C1 39-17 31-21 25 C-37 31-47 19-36 9Z" class="cloud"/>
      <path d="M-38 10 Q-23 23-10 14 Q5 27 18 16 Q29 23 40 9 C43 25 26 34 14 27 C1 39-17 31-21 25 C-37 31-47 19-38 10Z" fill="#a5b6c3"/>
    </g>
    <!-- Broad painted row: simple light cap over a deep, grouped shadow. -->
    <g id="row">
      <path d="M0 32 Q-4 12 14 13 Q19-3 37 7 Q50-9 68 5 Q85-6 100 7 Q117-6 134 7 Q151-7 168 7 Q185-3 197 11 Q216 2 229 17 Q250 13 254 33 Q266 47 250 57 Q230 67 211 58 Q190 73 168 61 Q146 76 122 62 Q99 75 77 61 Q54 72 34 58 Q10 66 0 49 Q-7 41 0 32Z" fill="#fff9e7" stroke="#7b94a2" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 32 Q17 43 36 30 Q54 48 77 33 Q98 50 121 35 Q145 50 167 34 Q190 49 210 33 Q232 47 254 33 Q266 47 250 57 Q230 67 211 58 Q190 73 168 61 Q146 76 122 62 Q99 75 77 61 Q54 72 34 58 Q10 66 0 49 Q-7 41 0 32Z" fill="#a4b7c6"/>
      <path d="M0 48 Q20 59 35 47 Q55 62 77 50 Q101 64 122 52 Q146 65 168 51 Q191 63 211 49 Q234 61 256 47 Q259 53 250 57 Q230 67 211 58 Q190 73 168 61 Q146 76 122 62 Q99 75 77 61 Q54 72 34 58 Q10 66 0 49Z" fill="#7e98ac"/>
    </g>
  </defs>
  <rect width="1400" height="900" fill="#f6f3ea"/>
  <text x="40" y="58" font-size="34" font-weight="650">How a stratocumulus cloud gets its shape</text>
  <text x="42" y="88" font-size="17" fill="#657c89">Shallow air rolls beneath a warm lid. Cells make a lumpy sheet; wind can arrange them into rows.</text>
  <g fill="#dcecf1" stroke="#bdced2" stroke-width="1.5">
    <rect x="30" y="120" width="325" height="735" rx="18"/>
    <rect x="368" y="120" width="325" height="735" rx="18"/>
    <rect x="706" y="120" width="325" height="735" rx="18"/>
    <rect x="1044" y="120" width="326" height="735" rx="18"/>
  </g>
  <!-- 1: Section through a closed cell; the inversion limits its depth. -->
  <g>
    <circle cx="60" cy="154" r="15" fill="#fffbee"/><text x="60" y="160" text-anchor="middle" font-size="17" font-weight="700">1</text>
    <text x="84" y="161" class="heading">Shallow cells</text>
    <text x="50" y="197" class="small">Moist air rolls beneath a warm lid</text>
    <text x="192" y="248" text-anchor="middle" class="label">strong inversion</text>
    <path d="M52 271 H333 V291 H52Z" fill="#f6dbbc" fill-opacity=".65"/>
    <path d="M52 291 H333" stroke="#c4a589" stroke-width="2"/>
    <path d="M77 395 C64 376 74 355 92 354 C90 333 108 321 126 328 Q134 310 154 315 Q169 300 187 311 Q209 299 226 315 Q249 308 261 329 Q285 325 291 350 Q314 355 306 378 L299 395 Q275 409 251 396 Q224 412 196 399 Q170 412 145 398 Q114 409 96 395Z" class="cloud"/>
    <path d="M77 375 Q101 391 124 375 Q148 393 171 378 Q196 393 220 376 Q247 392 271 374 Q289 387 307 372 L299 395 Q275 409 251 396 Q224 412 196 399 Q170 412 145 398 Q114 409 96 395 L77 395Z" fill="#a5b6c3"/>
    <path d="M191 520 V342 M178 340 C143 319 98 341 91 369 M205 340 C242 321 287 342 294 369 M82 402 Q70 455 99 487 M303 402 Q315 455 286 487 M110 505 Q146 523 170 495 M274 505 Q239 523 214 495" class="motion"/>
    <text x="192" y="448" text-anchor="middle" class="small">rising centre</text>
    <text x="192" y="565" text-anchor="middle" class="label">moist boundary layer</text>
    <path d="M65 593 H320 M65 586 V600 M320 586 V600" class="leader"/>
    <text x="192" y="619" text-anchor="middle" class="small">one closed cell: about 1–2 km</text>
    <text x="52" y="690" class="note"><tspan x="52">The lid keeps convection low.</tspan><tspan x="52" dy="27">Air rises in each centre,</tspan><tspan x="52" dy="27">spreads, then sinks at edges.</tspan></text>
    <text x="52" y="818" class="small">Closed-cell circulation, in section</text>
  </g>
  <!-- 2: Neighbouring cells have broad capped tops and sinking gaps. -->
  <g>
    <circle cx="398" cy="154" r="15" fill="#fffbee"/><text x="398" y="160" text-anchor="middle" font-size="17" font-weight="700">2</text>
    <text x="422" y="161" class="heading">A lumpy sheet</text>
    <text x="388" y="197" class="small">Cloud spreads sideways at the lid</text>
    <text x="531" y="258" text-anchor="middle" class="label">flattened, sunlit tops</text>
    <path d="M390 292 H672 V315 H390Z" fill="#f6dbbc" fill-opacity=".65"/>
    <path d="M390 315 H672" stroke="#c4a589" stroke-width="2"/>
    <path d="M398 407 C387 386 394 361 407 359 Q404 337 423 337 Q430 317 449 319 H478 Q496 318 502 339 Q522 339 518 362 Q536 374 522 397 Q525 424 505 427 Q489 440 471 430 Q450 444 432 431 Q408 439 398 420Z" class="cloud"/>
    <path d="M398 383 Q417 402 433 386 Q450 405 468 389 Q489 406 508 385 L525 381 Q530 391 522 397 Q525 424 505 427 Q489 440 471 430 Q450 444 432 431 Q408 439 398 420Z" fill="#9bafbe"/>
    <path d="M559 407 Q546 385 559 367 Q553 347 573 340 Q575 320 594 319 H624 Q643 317 649 337 Q670 342 665 364 Q680 383 665 399 Q671 421 650 428 Q630 443 611 431 Q590 442 575 430 Q554 432 559 407Z" class="cloud"/>
    <path d="M553 386 Q575 403 590 388 Q608 406 628 390 Q650 405 672 382 Q675 391 665 399 Q671 421 650 428 Q630 443 611 431 Q590 442 575 430 Q554 432 559 407 Q551 396 553 386Z" fill="#9bafbe"/>
    <path d="M539 348 V477 M407 454 Q450 478 478 460 M651 454 Q611 478 584 460" class="motion"/>
    <text x="533" y="520" text-anchor="middle" class="label">sinking air opens a gap</text>
    <path d="M535 496 L539 484" class="leader"/>
    <text x="531" y="594" text-anchor="middle" class="label">dark, scalloped undersides</text>
    <path d="M421 572 L407 549 L422 434" class="leader"/>
    <text x="390" y="690" class="note"><tspan x="390">The inversion flattens tops.</tspan><tspan x="390" dy="27">Shadows join beneath them;</tspan><tspan x="390" dy="27">sinking edges thin the cloud.</tspan></text>
    <text x="390" y="818" class="small">Cross-section through adjacent cells</text>
  </g>
  <!-- 3: Plan views show an illustrative change from cells to rolls. -->
  <g>
    <circle cx="736" cy="154" r="15" fill="#fffbee"/><text x="736" y="160" text-anchor="middle" font-size="17" font-weight="700">3</text>
    <text x="760" y="161" class="heading">Drift into rows</text>
    <text x="726" y="197" class="small">Wind carries cells and can align rolls</text>
    <text x="741" y="246" class="label">wind</text><path d="M791 241 H1000" class="motion"/>
    <use href="#cell" transform="translate(775 311) scale(.82)"/><use href="#cell" transform="translate(853 298) scale(.82)"/><use href="#cell" transform="translate(967 318) scale(.82)"/>
    <use href="#cell" transform="translate(809 377) scale(.82)"/><use href="#cell" transform="translate(903 370) scale(.82)"/><use href="#cell" transform="translate(978 386) scale(.65)"/>
    <text x="869" y="435" text-anchor="middle" class="small">later: rolls run along the wind</text>
    <path d="M737 487 Q728 475 741 465 Q741 451 757 454 Q771 441 785 453 Q803 443 818 454 Q836 440 850 454 Q868 443 881 455 Q898 444 913 455 Q932 443 946 454 Q965 443 979 456 Q1000 449 1007 467 Q1021 481 1005 490 Q988 500 972 491 Q952 503 934 492 Q912 504 893 492 Q870 504 850 492 Q831 503 813 492 Q792 504 774 491 Q751 503 737 487Z" class="cloud"/>
    <path d="M738 484 Q757 491 775 480 Q793 492 814 482 Q832 492 850 481 Q871 492 893 481 Q914 491 934 481 Q953 491 972 480 Q989 490 1009 480 L1005 490 Q988 500 972 491 Q952 503 934 492 Q912 504 893 492 Q870 504 850 492 Q831 503 813 492 Q792 504 774 491 Q751 503 738 484Z" fill="#a5b6c3"/>
    <path d="M740 566 Q729 550 744 541 Q743 527 761 530 Q774 518 792 531 Q811 520 826 532 Q845 518 860 532 Q880 521 892 537 Q900 553 886 564 Q869 577 852 566 Q830 578 811 566 Q790 578 773 566 Q752 578 740 566Z" class="cloud"/>
    <path d="M930 565 Q917 549 931 539 Q932 525 950 530 Q967 516 983 530 Q1001 524 1006 541 Q1019 558 1004 567 Q984 579 968 567 Q947 578 930 565Z" class="cloud"/>
    <path d="M741 558 Q758 570 774 554 Q793 568 812 556 Q832 567 852 555 Q869 568 892 551 Q897 560 886 564 Q869 577 852 566 Q830 578 811 566 Q790 578 773 566 Q752 578 741 558Z M929 556 Q949 567 968 554 Q985 568 1010 551 Q1014 561 1004 567 Q984 579 968 567 Q947 578 930 565Z" fill="#a5b6c3"/>
    <path d="M758 515 H993" class="motion"/>
    <text x="869" y="620" text-anchor="middle" class="label">gaps open and close</text><path d="M909 600 V568" class="leader"/>
    <text x="728" y="690" class="note"><tspan x="728">Cells drift and reshape.</tspan><tspan x="728" dy="27">Rolls can form cloud streets</tspan><tspan x="728" dy="27">parallel to the wind.</tspan></text>
    <text x="728" y="818" class="small">Plan views: one possible evolution</text>
  </g>
  <!-- 4: Rows increase in scale toward the viewer, with little top detail. -->
  <g>
    <circle cx="1074" cy="154" r="15" fill="#fffbee"/><text x="1074" y="160" text-anchor="middle" font-size="17" font-weight="700">4</text>
    <text x="1098" y="155" class="heading">Painted (Ghibli)</text><text x="1098" y="181" class="heading">simplification</text>
    <text x="1066" y="213" class="small">A low carpet of light and shadow</text>
    <g stroke="#b58d42" stroke-width="2" stroke-linecap="round">
      <circle cx="1092" cy="262" r="17" fill="#f7dda0"/>
      <path d="M1092 235 V229 M1092 289 V295 M1065 262 H1059 M1119 262 H1125 M1073 243 L1068 238 M1111 243 L1116 238 M1073 281 L1068 286 M1111 281 L1116 286"/>
      <path d="M1116 287 L1150 322" fill="none" marker-end="url(#lightArrow)"/>
    </g>
    <text x="1128" y="260" class="small">sunlight</text>
    <text x="1248" y="303" text-anchor="middle" class="label">little top detail</text>
    <path d="M1238 312 L1216 346" class="leader"/>
    <path d="M1066 340 H1348" stroke="#bdced2" stroke-width="1.5"/>
    <use href="#row" transform="translate(1075 344) scale(.25 .19)"/><use href="#row" transform="translate(1143 344) scale(.25 .19)"/><use href="#row" transform="translate(1211 344) scale(.25 .19)"/><use href="#row" transform="translate(1279 344) scale(.25 .19)"/>
    <use href="#row" transform="translate(1077 365) scale(.48 .32)"/><use href="#row" transform="translate(1210 365) scale(.48 .32)"/>
    <use href="#row" transform="translate(1083 401) scale(.94 .53)"/>
    <use href="#row" transform="translate(1074 452) scale(1.01 .78)"/>
    <use href="#row" transform="translate(1072 518) scale(1.04 1)"/>
    <text x="1205" y="626" text-anchor="middle" class="label">broad, connected under-shading</text>
    <path d="M1205 603 V585" class="leader"/>
    <text x="1066" y="690" class="note"><tspan x="1066">Keep the carpet lumpy.</tspan><tspan x="1066" dy="27">Group the deep shadows;</tspan><tspan x="1066" dy="27">shrink rows to the horizon.</tspan></text>
    <text x="1066" y="818" class="small">A painting study of the same structure</text>
  </g>
  <path d="M42 878 L66 878" class="motion"/><text x="77" y="883" font-size="13">air motion</text>
  <text x="1367" y="883" text-anchor="end" font-size="13" fill="#657c89">Schematic sections and plan views • cloud edges evolve continuously</text>
</svg>
