<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">How an altocumulus cloud gets its shape</title>
  <desc id="desc">Four schematic panels show top-cooled convection in a mid-level moist layer, rounded cloud elements in bands and a lenticular wave cloud, their evolution, and a painted simplification. Orange arrows indicate air motion. A standing-wave lens remains fixed while air flows through it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ce6847" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="lightArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b58d42" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #374750; }
      .heading { font-size: 21px; font-weight: 650; }
      .label { font-size: 16px; }
      .small { font-size: 14px; }
      .note { font-size: 17px; }
      .outline { stroke: #748c99; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .motion { fill: none; stroke: #ce6847; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .leader { fill: none; stroke: #657c89; stroke-width: 1.4; stroke-linecap: round; }
      .cloud { fill: #fffbee; stroke: #748c99; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <!-- Repeated rounded elements: scalloped crown and a separate shaded underside. -->
    <g id="element">
      <path d="M0 31 C-5 21 1 13 10 13 C9 3 21 -2 29 5 C35 -7 51 -4 55 8 C68 4 78 14 74 23 C86 28 82 39 72 42 Q35 51 6 42 Q0 39 0 31Z" class="cloud"/>
      <path d="M1 30 Q13 38 25 29 Q39 41 53 30 Q66 38 79 29 Q85 38 72 42 Q35 51 6 42 Q0 39 1 30Z" fill="#9bafbe"/>
    </g>
    <g id="lens">
      <path d="M0 23 Q65 -23 130 23 Q65 49 0 23Z" class="cloud"/>
      <path d="M0 23 Q65 32 130 23 Q65 49 0 23Z" fill="#9bafbe"/>
    </g>
  </defs>
  <rect width="1400" height="900" fill="#f6f3ea"/>
  <text x="40" y="58" font-size="34" font-weight="650">How an altocumulus cloud gets its shape</text>
  <text x="42" y="88" font-size="17" fill="#657c89">A moist layer overturns into small cloudlets. Wind arranges rows; standing waves can hold a smooth lens in place.</text>
  <g fill="#dcecf1" stroke="#bdced2" stroke-width="1.5">
    <rect x="30" y="120" width="325" height="735" rx="18"/>
    <rect x="368" y="120" width="325" height="735" rx="18"/>
    <rect x="706" y="120" width="325" height="735" rx="18"/>
    <rect x="1044" y="120" width="326" height="735" rx="18"/>
  </g>
  <!-- 1: Idealized Rayleigh–Bénard-like overturning driven by cooling aloft. -->
  <g>
    <circle cx="60" cy="154" r="15" fill="#fffbee"/><text x="60" y="160" text-anchor="middle" font-size="17" font-weight="700">1</text>
    <text x="84" y="161" class="heading">A layer overturns</text>
    <text x="50" y="197" class="small">Top cooling sets moist air in motion</text>
    <text x="192" y="246" text-anchor="middle" class="label">heat escapes from the top</text>
    <path d="M99 290 L99 263 M190 290 L190 263 M281 290 L281 263" class="motion"/>
    <path d="M53 313 Q190 300 332 313 L332 489 Q190 500 53 489Z" fill="#f6dbbc" fill-opacity=".48" stroke="#c4a589" stroke-width="1.8" stroke-dasharray="7 7"/>
    <path d="M54 313 Q190 300 331 313" fill="none" stroke="#748c99" stroke-width="3"/>
    <use href="#element" transform="translate(66 316) scale(.9)"/>
    <use href="#element" transform="translate(151 316) scale(.9)"/>
    <use href="#element" transform="translate(236 316) scale(.9)"/>
    <path d="M84 455 C68 424 71 382 92 369 M104 369 C127 380 139 420 125 450 M119 461 Q98 477 84 455" class="motion"/>
    <path d="M169 455 C153 424 156 382 177 369 M189 369 C212 380 224 420 210 450 M204 461 Q183 477 169 455" class="motion"/>
    <path d="M254 455 C238 424 241 382 262 369 M274 369 C297 380 309 420 295 450 M289 461 Q268 477 254 455" class="motion"/>
    <text x="192" y="532" text-anchor="middle" class="label">mid-level moist layer</text>
    <path d="M192 512 L192 493" class="leader"/>
    <text x="192" y="577" text-anchor="middle" class="label">rising moist air / sinking cool air</text>
    <text x="192" y="612" text-anchor="middle" class="small">Rayleigh–Bénard-like cells</text>
    <text x="52" y="690" class="note"><tspan x="52">Cooling makes the top dense.</tspan><tspan x="52" dy="27">Air sinks; moist air rises beside it.</tspan><tspan x="52" dy="27">Small cloudy crowns repeat.</tspan></text>
    <text x="52" y="818" class="small">Idealized cells, shown in cross-section</text>
  </g>
  <!-- 2: Cloudlet field and a separate standing-wave variant. -->
  <g>
    <circle cx="398" cy="154" r="15" fill="#fffbee"/><text x="398" y="160" text-anchor="middle" font-size="17" font-weight="700">2</text>
    <text x="422" y="161" class="heading">Cloudlets and lenses</text>
    <text x="388" y="197" class="small">Rounded elements gather into bands</text>
    <text x="390" y="236" class="small">wind along the bands</text>
    <path d="M553 231 L659 231" class="motion"/>
    <use href="#element" transform="translate(401 263) scale(.75)"/><use href="#element" transform="translate(489 263) scale(.75)"/><use href="#element" transform="translate(577 263) scale(.75)"/>
    <use href="#element" transform="translate(417 325) scale(.85)"/><use href="#element" transform="translate(505 325) scale(.85)"/><use href="#element" transform="translate(593 325) scale(.85)"/>
    <text x="530" y="401" text-anchor="middle" class="label">shaded bases • “mackerel sky”</text>
    <path d="M641 385 L639 365" class="leader"/>
    <rect x="387" y="430" width="287" height="215" rx="12" fill="#f6f3ea" fill-opacity=".55" stroke="#bdced2" stroke-width="1.5"/>
    <text x="401" y="454" class="label" font-weight="650">Lenticular variant</text>
    <use href="#lens" transform="translate(474 474) scale(.85 .65)"/>
    <use href="#lens" transform="translate(454 491) scale(1.15 .8)"/>
    <path d="M401 553 C438 553 454 506 519 506 C582 506 603 553 658 553" class="motion"/>
    <path d="M401 604 L450 604 Q481 602 507 568 Q519 555 531 568 Q557 600 584 604 L658 604 L658 619 L401 619Z" fill="#c9c7a8"/>
    <path d="M401 604 L450 604 Q481 602 507 568 Q519 555 531 568 Q557 600 584 604 L658 604" fill="none" stroke="#959b81" stroke-width="2"/>
    <text x="530" y="636" text-anchor="middle" class="small">standing wave over a hill</text>
    <text x="390" y="690" class="note"><tspan x="390">Each small lobe has a dark base.</tspan><tspan x="390" dy="27">In a wave, smooth lenses stack;</tspan><tspan x="390" dy="27">air passes through a fixed shape.</tspan></text>
    <text x="390" y="818" class="small">Cloud bands above; wave inset below</text>
  </g>
  <!-- 3: A sequence through time, followed by a fixed wave lens. -->
  <g>
    <circle cx="736" cy="154" r="15" fill="#fffbee"/><text x="736" y="160" text-anchor="middle" font-size="17" font-weight="700">3</text>
    <text x="760" y="161" class="heading">Form, drift, fade</text>
    <text x="726" y="197" class="small">Cloudlets change as their air moves</text>
    <text x="730" y="245" class="label">form</text>
    <use href="#element" transform="translate(803 221) scale(.58)"/><use href="#element" transform="translate(887 221) scale(.65)"/>
    <path d="M965 240 L996 240" class="motion"/>
    <path d="M774 261 L774 292" class="motion"/>
    <text x="730" y="326" class="label">drift</text>
    <use href="#element" transform="translate(837 299) scale(.7)"/><use href="#element" transform="translate(925 299) scale(.7)"/>
    <path d="M774 342 L774 373" class="motion"/>
    <text x="730" y="409" class="label">merge</text>
    <use href="#element" transform="translate(815 382) scale(.75)"/><use href="#element" transform="translate(864 382) scale(.75)"/><use href="#element" transform="translate(913 382) scale(.75)"/>
    <path d="M774 425 L774 456" class="motion"/>
    <text x="730" y="494" class="label">thin</text>
    <g opacity=".42"><use href="#element" transform="translate(827 473) scale(.85 .35)"/><use href="#element" transform="translate(927 479) scale(.6 .23)"/></g>
    <path d="M929 465 Q963 445 995 458" class="motion" opacity=".5" stroke-dasharray="4 6"/>
    <text x="872" y="537" text-anchor="middle" class="small">mixing with dry air → evaporation</text>
    <path d="M731 554 L1006 554" stroke="#bdced2" stroke-width="1.5"/>
    <use href="#lens" transform="translate(813 572) scale(.9 .7)"/>
    <path d="M733 601 C774 601 797 582 826 582 M918 582 Q963 601 1000 601" class="motion"/>
    <path d="M872 563 L872 621" class="leader" stroke-dasharray="3 5"/>
    <text x="869" y="643" text-anchor="middle" class="small">lens stays at the wave crest</text>
    <text x="728" y="690" class="note"><tspan x="728">Elements drift and join into rows,</tspan><tspan x="728" dy="27">then thin as droplets evaporate.</tspan><tspan x="728" dy="27">A wave lens continually renews.</tspan></text>
    <text x="728" y="818" class="small">Moving cloudlets; stationary wave form</text>
  </g>
  <!-- 4: Painted study: repeated scallops versus continuous lens contours. -->
  <g>
    <circle cx="1074" cy="154" r="15" fill="#fffbee"/><text x="1074" y="160" text-anchor="middle" font-size="17" font-weight="700">4</text>
    <text x="1098" y="155" class="heading">Painted (Ghibli)</text><text x="1098" y="181" class="heading">simplification</text>
    <text x="1066" y="213" class="small">Small scallops; long, smooth lenses</text>
    <g stroke="#b58d42" stroke-width="2" stroke-linecap="round">
      <circle cx="1092" cy="259" r="17" fill="#f7dda0"/>
      <path d="M1092 232 V226 M1092 286 V292 M1065 259 H1059 M1119 259 H1125 M1073 240 L1068 235 M1111 240 L1116 235 M1073 278 L1068 283 M1111 278 L1116 283"/>
      <path d="M1120 279 L1150 310" fill="none" marker-end="url(#lightArrow)"/>
    </g>
    <text x="1131" y="260" class="small">sunlight</text>
    <use href="#element" transform="translate(1082 328) scale(.52)"/><use href="#element" transform="translate(1144 324) scale(.52)"/><use href="#element" transform="translate(1206 320) scale(.52)"/><use href="#element" transform="translate(1268 316) scale(.52)"/>
    <use href="#element" transform="translate(1074 376) scale(.65)"/><use href="#element" transform="translate(1140 372) scale(.65)"/><use href="#element" transform="translate(1206 368) scale(.65)"/><use href="#element" transform="translate(1272 364) scale(.65)"/>
    <use href="#element" transform="translate(1069 431) scale(.78)"/><use href="#element" transform="translate(1136 427) scale(.78)"/><use href="#element" transform="translate(1203 423) scale(.78)"/><use href="#element" transform="translate(1270 419) scale(.78)"/>
    <text x="1207" y="503" text-anchor="middle" class="label">many small shaded lumps in rows</text>
    <use href="#lens" transform="translate(1142 541) scale(1 .7)"/>
    <use href="#lens" transform="translate(1118 562) scale(1.38 .85)"/>
    <use href="#lens" transform="translate(1091 587) scale(1.8 .95)"/>
    <text x="1207" y="652" text-anchor="middle" class="label">smooth stacked lens</text>
    <text x="1066" y="690" class="note"><tspan x="1066">Repeat small, rounded crowns.</tspan><tspan x="1066" dy="27">Group the cool underside tones.</tspan><tspan x="1066" dy="27">Keep the lens contours unbroken.</tspan></text>
    <text x="1066" y="818" class="small">A painting study of the same structures</text>
  </g>
  <path d="M42 878 L66 878" class="motion"/><text x="77" y="883" font-size="13">air motion</text>
  <text x="1367" y="883" text-anchor="end" font-size="13" fill="#657c89">Schematic cross-sections • cloud edges evolve continuously</text>
</svg>
